<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Support Application - PulseCAD</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #080d1f;
            color: #1a202c;
            padding: 40px 24px;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        #networkBackground {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: radial-gradient(circle at 50% 15%, #151c43 0%, #090d20 55%, #050713 100%);
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            background:
                linear-gradient(rgba(80, 105, 180, 0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(80, 105, 180, 0.035) 1px, transparent 1px);
            background-size: 54px 54px;
        }

        .container {
            max-width: 560px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
            padding: 28px;
            border: 1px solid rgba(148, 163, 184, 0.18);
            border-radius: 20px;
            background: rgba(248, 250, 252, 0.96);
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.38);
            backdrop-filter: blur(10px);
        }

        .app-head {
            font-size: 22px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 20px;
        }

        .app-form label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 8px;
        }

        .app-form .field-oval {
            border: 1px solid #e2e8f0;
            border-radius: 999px;
            padding: 12px 16px;
            margin-bottom: 16px;
            background: #ffffff;
        }

        .app-form .field-oval input {
            width: 100%;
            border: none;
            background: transparent;
            padding: 0;
            font-size: 14px;
            color: #1a202c;
            outline: none;
        }

        .app-form .field-oval input:focus {
            outline: none;
        }

        .scale-rating {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 0;
        }

        .scale-btn {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 1px solid #e2e8f0;
            background: #ffffff;
            color: #475569;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .scale-btn:hover {
            border-color: #2563eb;
            color: #2563eb;
        }

        .scale-btn.active {
            background: #2563eb;
            color: #ffffff;
            border-color: #2563eb;
        }

        .scale-label {
            font-size: 12px;
            color: #94a3b8;
            font-weight: 600;
            min-width: 50px;
        }

        .submit-btn {
            margin-top: 8px;
            width: 100%;
            text-align: center;
            padding: 10px 12px;
            border-radius: 999px;
            border: 1px solid #e2e8f0;
            background: #2563eb;
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .submit-btn:hover {
            background: #1d4ed8;
        }
    </style>
</head>
<body>
    <canvas id="networkBackground" aria-hidden="true"></canvas>
    <div class="container">
        <div class="app-head">Customer Support Application</div>
        <form class="app-form" id="appForm">
            <label>Email <span style="color:#f87171;">*</span></label>
            <div class="field-oval"><input type="email" name="email" placeholder="you@example.com" required /></div>

            <label>What is your Discord username and ID?</label>
            <div class="field-oval"><input type="text" name="discord" /></div>

            <label>How old are you?</label>
            <div class="field-oval"><input type="text" name="age" /></div>

            <label>What time zone are you in?</label>
            <div class="field-oval"><input type="text" name="timezone" /></div>

            <label>How active can you be each week? <span style="color:#f87171;">*</span></label>
            <div class="field-oval" style="display:flex; align-items:center; gap:10px;">
                <div class="scale-rating" id="activeScale">
                    <button type="button" class="scale-btn" data-val="1">1</button>
                    <button type="button" class="scale-btn" data-val="2">2</button>
                    <button type="button" class="scale-btn" data-val="3">3</button>
                    <button type="button" class="scale-btn" data-val="4">4</button>
                    <button type="button" class="scale-btn" data-val="5">5</button>
                    <button type="button" class="scale-btn" data-val="6">6</button>
                    <button type="button" class="scale-btn" data-val="7">7</button>
                    <button type="button" class="scale-btn" data-val="8">8</button>
                    <button type="button" class="scale-btn" data-val="9">9</button>
                    <button type="button" class="scale-btn" data-val="10">10</button>
                </div>
                <input type="hidden" name="active_rating" id="activeRating" required />
            </div>
            <div style="font-size:12px; color:#94a3b8; margin-top:-8px; margin-bottom:16px; padding:0 16px;">
                <span id="activeLabelLow">Not very active</span> &mdash; <span id="activeLabelHigh">Very active</span>
            </div>

            <label>Have you been a member of our community before? If so, for how long?</label>
            <div class="field-oval"><input type="text" name="member" /></div>

            <button type="submit" class="submit-btn" id="submitBtn">Submit</button>
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        (() => {
            const canvas = document.getElementById("networkBackground");
            if (!canvas) return;

            const ctx = canvas.getContext("2d");
            let nodes = [];
            let width = 0;
            let height = 0;

            function resize() {
                const dpr = Math.min(window.devicePixelRatio || 1, 2);
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = width * dpr;
                canvas.height = height * dpr;
                canvas.style.width = width + "px";
                canvas.style.height = height + "px";
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

                const count = Math.min(70, Math.max(28, Math.floor(width * height / 18000)));
                nodes = Array.from({ length: count }, () => ({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    vx: (Math.random() - 0.5) * 0.24,
                    vy: (Math.random() - 0.5) * 0.24,
                    r: Math.random() * 1.2 + 0.7
                }));
            }

            function draw() {
                ctx.clearRect(0, 0, width, height);

                for (let i = 0; i < nodes.length; i++) {
                    const node = nodes[i];
                    node.x += node.vx;
                    node.y += node.vy;

                    if (node.x < -20) node.x = width + 20;
                    if (node.x > width + 20) node.x = -20;
                    if (node.y < -20) node.y = height + 20;
                    if (node.y > height + 20) node.y = -20;

                    for (let j = i + 1; j < nodes.length; j++) {
                        const other = nodes[j];
                        const dx = node.x - other.x;
                        const dy = node.y - other.y;
                        const distance = Math.sqrt(dx * dx + dy * dy);

                        if (distance < 150) {
                            ctx.beginPath();
                            ctx.moveTo(node.x, node.y);
                            ctx.lineTo(other.x, other.y);
                            ctx.strokeStyle = `rgba(92, 115, 190, ${(1 - distance / 150) * 0.22})`;
                            ctx.lineWidth = 0.7;
                            ctx.stroke();
                        }
                    }

                    ctx.beginPath();
                    ctx.arc(node.x, node.y, node.r, 0, Math.PI * 2);
                    ctx.fillStyle = "rgba(145, 166, 218, 0.48)";
                    ctx.fill();
                }

                requestAnimationFrame(draw);
            }

            window.addEventListener("resize", resize);
            resize();
            draw();
        })();

        const SUPABASE_URL = "https://zwdogalwbczdtvxvhrfd.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp3ZG9nYWx3YmN6ZHR2eHZocmZkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM2NTA2MjQsImV4cCI6MjA5OTIyNjYyNH0.baPVVTtW0d3FDC2pTd1P3d5aoIc2FZkaD-6bBvDPFWw";

        const localSupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const form = document.getElementById("appForm");

        if (form) {
            let copyPasteDetected = false;

            (async () => {
                const emailInput = form.email;
                if (!emailInput) return;
                if (!localSupabase) return;
                try {
                    const { data: { user } } = await localSupabase.auth.getUser();
                    if (user?.email) {
                        emailInput.value = user.email;
                    }
                } catch (err) {
                    console.error("Failed to autofill email:", err);
                }
            })();

            form.addEventListener("paste", (e) => {
                e.preventDefault();
                copyPasteDetected = true;
            });

            const activeScale = document.getElementById("activeScale");
            const activeRating = document.getElementById("activeRating");
            const activeLabelLow = document.getElementById("activeLabelLow");
            const activeLabelHigh = document.getElementById("activeLabelHigh");
            if (activeScale) {
                const labels = {
                    1: "Not at all", 2: "Rarely", 3: "Occasionally", 4: "Lightly",
                    5: "Moderate", 6: "Regularly", 7: "Often", 8: "Very often",
                    9: "Almost daily", 10: "Daily / Always"
                };
                activeScale.querySelectorAll(".scale-btn").forEach((btn) => {
                    btn.addEventListener("click", () => {
                        const val = btn.getAttribute("data-val");
                        activeRating.value = val;
                        activeScale.querySelectorAll(".scale-btn").forEach((b) => b.classList.remove("active"));
                        btn.classList.add("active");
                        if (activeLabelLow) activeLabelLow.textContent = labels[val] || "";
                        if (activeLabelHigh) activeLabelHigh.textContent = labels[val] || "";
                    });
                });
                // default selection
                activeRating.value = "5";
                activeScale.querySelector('.scale-btn[data-val="5"]').classList.add("active");
                if (activeLabelLow) activeLabelLow.textContent = labels[5];
                if (activeLabelHigh) activeLabelHigh.textContent = labels[5];
            }

            form.addEventListener("copy", (e) => {
                e.preventDefault();
                copyPasteDetected = true;
            });

            form.addEventListener("cut", (e) => {
                e.preventDefault();
                copyPasteDetected = true;
            });

            form.addEventListener("contextmenu", (e) => {
                e.preventDefault();
            });

            form.addEventListener("keydown", (e) => {
                if ((e.ctrlKey || e.metaKey) && (e.key === "c" || e.key === "v" || e.key === "x")) {
                    e.preventDefault();
                    copyPasteDetected = true;
                }
            });

            form.addEventListener("submit", async (e) => {
                e.preventDefault();

                if (!localSupabase) {
                    alert("You must be logged in to submit an application.");
                    return;
                }

                const { data: { user } } = await localSupabase.auth.getUser();
                if (!user) {
                    alert("You must be logged in to submit an application.");
                    if (btn) {
                        btn.disabled = false;
                        btn.textContent = "Submit";
                    }
                    return;
                }

                const btn = document.getElementById("submitBtn");
                if (btn) {
                    btn.disabled = true;
                    btn.textContent = "Submitting...";
                }

                const activeRating = document.getElementById("activeRating").value || "5";

                const payload = {
                    email: user.email || form.email.value.trim(),
                    discord: form.discord.value.trim(),
                    age: form.age.value.trim(),
                    timezone: form.timezone.value.trim(),
                    active_rating: activeRating ? parseInt(activeRating, 10) : null,
                    member: form.member.value.trim(),
                    copy_paste_detected: copyPasteDetected
                };

                const { error } = await localSupabase
                    .from("application_submissions")
                    .insert([payload]);

                if (error) {
                    alert("Failed to submit: " + error.message);
                    if (btn) {
                        btn.disabled = false;
                        btn.textContent = "Submit";
                    }
                    return;
                }

                if (btn) {
                    btn.textContent = "Submitted";
                }
                alert("Application submitted.");
                form.reset();
            });
        }
    </script>
</body>
</html>
