<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mod Panel - PulseCAD</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #090a0c;
            color: #f4f4f5;
        }
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 24px;
            background: #101114;
            border-bottom: 1px solid #25262a;
        }
        .topbar-title { display: flex; flex-direction: column; gap: 2px; }
        .topbar-server-name { font-size: 14px; font-weight: 700; color: #f4f4f5; }
        .topbar-subtitle { font-size: 12px; font-weight: 600; color: #92939a; }
        .back-btn {
            border: 1px solid #34353a;
            background: #191a1e;
            color: #f4f4f5;
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
        }
        .my-messages-btn {
            border: 1px solid #34353a;
            background: #191a1e;
            color: #f4f4f5;
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            font-size: 13px;
        }
        .my-messages-btn:hover { background: #1c1d21; }
        .my-messages-btn.primary { background: #2563eb; border-color: #2563eb; color: #fff; }
        .my-messages-btn.primary:hover { background: #1d4ed8; }
        .pm-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 800;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .pm-modal.open { display: flex; }
        .pm-modal-card {
            position: relative;
            width: 100%;
            max-width: 460px;
            background: #101114;
            border: 1px solid #25262a;
            border-radius: 14px;
            padding: 22px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
            max-height: 80vh;
            overflow-y: auto;
        }
        .pm-modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
        }
        .pm-modal-title { font-size: 16px; font-weight: 700; color: #f4f4f5; }
        .pm-modal-close {
            border: none;
            background: transparent;
            color: #92939a;
            font-size: 22px;
            cursor: pointer;
            line-height: 1;
            padding: 2px 6px;
            border-radius: 6px;
        }
        .pm-modal-close:hover { background: #1c1d21; color: #f4f4f5; }
        .pm-thread { display: flex; flex-direction: column; gap: 8px; }
        .pm-thread-empty { color: #92939a; font-size: 13px; text-align: center; padding: 20px 0; }
        .pm-thread-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
            padding: 8px 10px;
            border-radius: 9px;
            background: #111216;
            border: 1px solid #25262a;
            font-size: 13px;
        }
        .pm-thread-item .pm-sender { font-weight: 700; color: #63d9ad; font-size: 11px; }
        .pm-thread-item .pm-text { color: #f4f4f5; }
        .pm-thread-item .pm-time { color: #777980; font-size: 10px; }
        .pm-thread-item.mine { background: #16223a; border-color: #2563eb; }
        .pm-thread-item.mine .pm-sender { color: #93c5fd; }
        .pm-compose { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
        .pm-compose textarea {
            width: 100%;
            min-height: 70px;
            padding: 10px 12px;
            border: 1px solid #34353a;
            border-radius: 9px;
            font-size: 14px;
            background: #111216;
            color: #f4f4f5;
            outline: none;
            resize: vertical;
            font-family: inherit;
        }
        .pm-compose textarea:focus { border-color: #2563eb; }
        .pm-send-btn {
            padding: 10px 14px;
            border: none;
            border-radius: 9px;
            background: #2563eb;
            color: #ffffff;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }
        .pm-send-btn:disabled { opacity: 0.6; cursor: default; }
        .pm-status { font-size: 13px; margin-top: 10px; color: #92939a; text-align: center; }
        .pm-status.error { color: #f87171; font-weight: 700; }
        .pm-status.ok { color: #63d9ad; font-weight: 700; }
        .container { max-width: 520px; margin: 0 auto; padding: 24px; }
        .card {
            background: #101114;
            border: 1px solid #25262a;
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .card h2 { margin: 0 0 4px; font-size: 20px; color: #f4f4f5; }
        .card h3 { margin: 0 0 12px; font-size: 16px; color: #f4f4f5; }
        .meta { font-size: 13px; color: #92939a; }
        .shift-card {
            position: fixed;
            top: 100px;
            left: 16px;
            z-index: 600;
            width: 300px;
            max-width: calc(100% - 32px);
            padding: 16px;
        }
        .shift-backdrop {
            position: fixed;
            top: 100px;
            left: 16px;
            z-index: 599;
            width: 300px;
            max-width: calc(100% - 32px);
            background: #101114;
            border: 1px solid #25262a;
            border-radius: 14px;
            box-shadow: 0 18px 42px rgba(0,0,0,0.2);
        }
        .shift-heading {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
        }
        .shift-name { font-size: 14px; font-weight: 750; color: #f4f4f5; }
        .shift-role { margin-top: 3px; font-size: 12px; color: #92939a; }
        .shift-time { padding-top: 1px; color: #c8c8cc; font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
        .shift-status {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            margin-top: 12px;
            padding: 5px 9px;
            border-radius: 999px;
            background: #102820;
            color: #63d9ad;
            font-size: 11px;
            font-weight: 700;
        }
        .shift-status::before {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: currentColor;
            content: "";
        }
        .shift-status.off-duty { background: #242529; color: #a1a1aa; }
        .shift-status.on-break { background: #302514; color: #f4bb65; }
        .shift-controls { display: flex; gap: 8px; margin-top: 11px; }
        .shift-btn {
            flex: 1;
            min-height: 36px;
            padding: 8px 10px;
            border: 1px solid #292a2f;
            border-radius: 9px;
            background: #111216;
            color: #dedee2;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }
        .shift-btn:hover:not(:disabled) { background: #1c1d21; }
        .shift-btn:disabled { opacity: 0.55; cursor: default; }
        .shift-btn.start {
            background: #ffffff;
            color: #090a0c;
            border-color: #ffffff;
        }
        .shift-btn.start:hover:not(:disabled) { background: #e5e5e5; border-color: #e5e5e5; }
        .shift-btn.end-shift {
            border-color: #493034;
            background: #241719;
            color: #f09a9a;
        }
        .shift-btn.end-shift:hover:not(:disabled) { background: #321d20; }
        .shift-note { margin: 8px 0 0; color: #777980; font-size: 11px; line-height: 1.45; }
        .shift-footer {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid #25262a;
            color: #a1a1aa;
            font-size: 11px;
        }
        .shift-footer-dot { width: 7px; height: 7px; border-radius: 50%; background: #55565d; }
        .shift-footer-dot.active { background: #35c995; }
        .shift-footer-dot.on-break { background: #f4bb65; }
        .active-staff-card {
            position: fixed;
            top: 120px;
            right: 16px;
            z-index: 550;
            width: 300px;
            max-width: calc(100% - 32px);
            cursor: grab;
            box-shadow: 0 18px 42px rgba(0,0,0,0.2);
        }
        .active-staff-card.dragging { cursor: grabbing; }
        .active-staff-card h3 { margin: 0 0 4px; font-size: 16px; color: #f4f4f5; }
        .active-staff-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 10px 12px;
            background: #111216;
            border: 1px solid #25262a;
            border-radius: 9px;
            font-size: 13px;
        }
        .active-staff-name { font-weight: 700; color: #f4f4f5; }
        .active-staff-meta { color: #92939a; font-size: 12px; }
        .active-staff-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 10px;
            font-weight: 700;
        }
        .active-staff-badge.on-duty { background: #102820; color: #63d9ad; }
        .active-staff-badge.on-break { background: #302514; color: #f4bb65; }
        .active-staff-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
        .active-staff-resize {
            position: absolute;
            bottom: 6px;
            right: 6px;
            width: 14px;
            height: 14px;
            cursor: nwse-resize;
            background: linear-gradient(135deg, transparent 50%, #92939a 50%);
            border-radius: 0 0 14px 0;
            opacity: 0.6;
        }
        .active-staff-resize:hover { opacity: 1; }
        .active-players-card {
            position: fixed;
            top: 120px;
            right: 16px;
            z-index: 540;
            width: 300px;
            max-width: calc(100% - 32px);
            box-shadow: 0 18px 42px rgba(0,0,0,0.2);
        }
        .active-players-list { display: flex; flex-direction: column; gap: 6px; max-height: 280px; overflow-y: auto; }
        .active-player-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 8px 10px;
            background: #111216;
            border: 1px solid #25262a;
            border-radius: 9px;
            font-size: 13px;
        }
        .active-player-name { font-weight: 700; color: #f4f4f5; }
        .active-player-meta { color: #92939a; font-size: 11px; }
        .active-player-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 7px;
            border-radius: 999px;
            font-size: 9px;
            font-weight: 700;
        }
        .active-player-badge.staff { background: #102820; color: #63d9ad; }
        .active-player-badge.civilian { background: #242529; color: #a1a1aa; }
        .active-staff-list { display: flex; flex-direction: column; gap: 8px; }
        .toolbox-label {
            font-size: 11px;
            font-weight: 700;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 10px;
            text-align: center;
        }
        .toolbox-btn {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #292a2f;
            border-radius: 9px;
            background: #111216;
            color: #dedee2;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 6px;
        }
        .toolbox-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .toolbox-btn:disabled:hover { background: #111216; }
        .toolbox-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 700;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .toolbox-modal.open { display: flex; }
        .toolbox-modal-card {
            position: relative;
            width: 100%;
            max-width: 480px;
            background: #101114;
            border: 1px solid #25262a;
            border-radius: 14px;
            padding: 22px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
        }
        .toolbox-modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
        }
        .toolbox-modal-title {
            font-size: 16px;
            font-weight: 700;
            color: #f4f4f5;
        }
        .toolbox-modal-close {
            border: none;
            background: transparent;
            color: #92939a;
            font-size: 22px;
            cursor: pointer;
            line-height: 1;
            padding: 2px 6px;
            border-radius: 6px;
        }
        .toolbox-modal-close:hover { background: #1c1d21; color: #f4f4f5; }
        .toolbox-side-arrow {
            position: absolute;
            top: 50%;
            left: -16px;
            transform: translateY(-50%);
            width: 28px;
            height: 28px;
            border: 1px solid #34353a;
            border-radius: 50%;
            background: #111216;
            color: #92939a;
            font-size: 14px;
            cursor: pointer;
            z-index: 710;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        .toolbox-side-arrow:hover { background: #1c1d21; color: #f4f4f5; border-color: #4a4b50; }
        .toolbox-panel { display: none; }
        .toolbox-panel.active { display: block; }
        .toolbox-field { margin-bottom: 14px; }
        .toolbox-field label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 8px; color: #dedee2; }
        .toolbox-input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #34353a;
            border-radius: 9px;
            font-size: 14px;
            background: #111216;
            color: #f4f4f5;
            outline: none;
        }
        .toolbox-input:focus { border-color: #2563eb; }
        .toolbox-send {
            width: 100%;
            padding: 10px 14px;
            border: none;
            border-radius: 9px;
            background: #2563eb;
            color: #ffffff;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }
        .toolbox-send:disabled { opacity: 0.6; cursor: default; }
        .toolbox-status { font-size: 13px; margin-top: 10px; color: #92939a; text-align: center; }
        .toolbox-status.error { color: #f87171; font-weight: 700; }
        .toolbox-status.ok { color: #63d9ad; font-weight: 700; }
        .member-badge.management {
            display: inline-block;
            margin-left: 6px;
            padding: 1px 6px;
            border-radius: 999px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #ffffff;
            background: #1e40af;
            vertical-align: middle;
        }
        .field { margin-top: 6px; }
        .field label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 6px; color: #dedee2; }
        .erlc-input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #34353a;
            border-radius: 8px;
            font-size: 14px;
            background: #111216;
            color: #f4f4f5;
        }
        .send-btn {
            margin-top: 12px;
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: #ffffff;
            font-weight: 700;
            cursor: pointer;
        }
        .send-btn:disabled { opacity: 0.6; cursor: default; }
        .status { font-size: 13px; margin-top: 10px; color: #92939a; }
        .status.error { color: #f87171; font-weight: 700; }
        .status.ok { color: #63d9ad; font-weight: 700; }
        .hidden { display: none; }
        @media (max-width: 520px) {
            .container { padding: 16px; }
            .topbar { padding: 12px 16px; }
            .shift-card { top: 60px; left: 12px; }
        }

</head>
<body>
    <div class="topbar">
        <div class="topbar-title">
            <div class="topbar-server-name" id="topbarServerName">Loading...</div>
            <div class="topbar-subtitle">Moderation Panel</div>
        </div>
        <div class="topbar-actions">
            <button class="my-messages-btn primary" id="myMessagesBtn">My Messages</button>
            <button class="back-btn" id="backBtn">← Back</button>
        </div>
    </div>
    <div class="container" id="container">
        <div class="shift-backdrop"></div>
        <section class="card shift-card" aria-label="Shift status">
            <div class="shift-heading">
                <div>
                    <div class="shift-name" id="shiftName">Hey there!</div>
                    <div class="shift-role">
                        <span id="shiftRole">Community Moderator</span>
                        <span class="member-badge management" id="managementBadge" style="display:none;">Management</span>
                    </div>
                </div>
                <div class="shift-time" id="shiftTime" aria-label="Shift duration">00:00:00</div>
            </div>
            <div class="shift-status off-duty" id="shiftBadge">Off duty</div>
            <div class="shift-controls">
                <button type="button" class="shift-btn start" id="startShiftBtn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="vertical-align:middle; margin-right:4px;"><polygon points="6 4 20 12 6 20"></polygon></svg>
                    Start shift
                </button>
                <button type="button" class="shift-btn hidden" id="breakShiftBtn">Ⅱ &nbsp; Break</button>
                <button type="button" class="shift-btn end-shift hidden" id="endShiftBtn">□ &nbsp; End shift</button>
            </div>
            <p class="shift-note">Your timer tracks total time since you started your shift.</p>
<div class="toolbox-label">Toolbox</div>
                <button type="button" class="toolbox-btn" id="toolboxBtn">Toolbox</button>
                <div class="shift-footer">
                <span class="shift-footer-dot" id="shiftFooterDot"></span>
                <span id="shiftFooterText">You are not on duty</span>
            </div>
            <div class="status hidden" id="shiftStatus" role="status"></div>
        </section>
        <div class="card active-staff-card">
            <h3>Active Staff</h3>
            <div id="activeStaffList" class="active-staff-list">
                <div class="active-staff-meta">Loading...</div>
            </div>
            <div class="active-staff-resize" id="activeStaffResize"></div>
        </div>
        <div class="card active-players-card">
            <h3>Active Players</h3>
            <div id="activePlayersList" class="active-players-list">
                <div class="active-player-meta">Loading...</div>
            </div>
        </div>
        <div class="toolbox-modal" id="toolboxModal">
            <div class="toolbox-modal-card">
                <div class="toolbox-modal-header">
                    <span class="toolbox-modal-title" id="toolboxModalTitle">Toolbox</span>
                    <button type="button" class="toolbox-modal-close" id="toolboxModalClose" aria-label="Close">×</button>
                </div>
                <div class="toolbox-panel active" id="toolboxPanelM">
                    <div class="toolbox-field">
                        <label for="toolboxMsgInput">Send a :m message to the server</label>
                        <input type="text" id="toolboxMsgInput" class="toolbox-input" placeholder="Type your message..." />
                    </div>
                    <button type="button" class="toolbox-send" id="toolboxSendBtn">Send :m</button>
                    <div class="toolbox-status" id="toolboxStatus"></div>
                </div>
                <div class="toolbox-panel" id="toolboxPanelH">
                    <div class="toolbox-field">
                        <label for="toolboxHInput">Send a :h message to the server</label>
                        <input type="text" id="toolboxHInput" class="toolbox-input" placeholder="Type your message..." />
                    </div>
                    <button type="button" class="toolbox-send" id="toolboxHSendBtn">Send :h</button>
                    <div class="toolbox-status" id="toolboxHStatus"></div>
                </div>
                <button type="button" class="toolbox-side-arrow" id="toolboxSideArrow" aria-label="More">›</button>
            </div>
        </div>
        <div class="pm-modal" id="pmModal">
            <div class="pm-modal-card">
                <div class="pm-modal-header">
                    <span class="pm-modal-title" id="pmModalTitle">My Messages</span>
                    <button type="button" class="pm-modal-close" id="pmModalClose" aria-label="Close">×</button>
                </div>
                <div class="pm-thread" id="pmThread">
                    <div class="pm-thread-empty">No messages yet.</div>
                </div>
                <div class="pm-compose">
                    <textarea id="pmComposeInput" placeholder="Type your message..." rows="3"></textarea>
                    <button type="button" class="pm-send-btn" id="pmSendBtn">Send</button>
                    <div class="pm-status" id="pmStatus"></div>
                </div>
            </div>
        </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

        function fmtDuration(startedAt) {
            const seconds = Math.floor((Date.now() - startedAt) / 1000);
            const h = String(Math.floor(seconds / 3600)).padStart(2, "0");
            const m = String(Math.floor((seconds % 3600) / 60)).padStart(2, "0");
            const s = String(seconds % 60).padStart(2, "0");
            return h + ":" + m + ":" + s;
        }

        function renderShift() {
            const onDuty = shiftStartedAt !== null;
            startShiftBtn.classList.toggle("hidden", onDuty);
            breakShiftBtn.classList.toggle("hidden", !onDuty);

            shiftBadgeEl.textContent = !onDuty ? "Off duty" : shiftOnBreak ? "On break" : "On duty";
            shiftBadgeEl.className = "shift-status" + (!onDuty ? " off-duty" : shiftOnBreak ? " on-break" : "");
            shiftFooterDotEl.classList.toggle("active", onDuty && !shiftOnBreak);
            shiftFooterDotEl.classList.toggle("on-break", onDuty && shiftOnBreak);
            shiftFooterTextEl.textContent = !onDuty ? "You are not on duty" : shiftOnBreak ? "You are on break" : "You are on duty";
            breakShiftBtn.textContent = shiftOnBreak ? "▶  Resume" : "Ⅱ  Break";

        (function () {
            const card = document.querySelector(".active-staff-card");
            if (!card) return;
            let dragging = false;
            let startX = 0, startY = 0;
            let origX = 0, origY = 0;
            card.addEventListener("mousedown", (e) => {
                if (e.target.closest("button, input, a")) return;
                dragging = true;
                card.classList.add("dragging");
                const rect = card.getBoundingClientRect();
                startX = e.clientX;
                startY = e.clientY;
                origX = rect.left;
                origY = rect.top;
                e.preventDefault();
            });
            document.addEventListener("mousemove", (e) => {
                if (!dragging) return;
                const dx = e.clientX - startX;
                const dy = e.clientY - startY;
                let nx = origX + dx;
                let ny = origY + dy;
                const w = card.offsetWidth;
                const h = card.offsetHeight;
                const maxW = window.innerWidth - w;
                const maxH = window.innerHeight - h;
                nx = Math.max(0, Math.min(nx, maxW));
                ny = Math.max(0, Math.min(ny, maxH));
                card.style.left = nx + "px";
                card.style.top = ny + "px";
            });
            document.addEventListener("mouseup", () => {
                if (!dragging) return;
                dragging = false;
                card.classList.remove("dragging");
            });
        })();

            resizeHandle.addEventListener("mousedown", (e) => {
                resizing = true;
                startX = e.clientX;
                startY = e.clientY;
                startW = card.offsetWidth;
                startH = card.offsetHeight;
                e.preventDefault();
                e.stopPropagation();
            });
            document.addEventListener("mousemove", (e) => {
                if (!resizing) return;
                const dx = e.clientX - startX;
                const dy = e.clientY - startY;
                let w = Math.max(240, startW + dx);
                let h = Math.max(120, startH + dy);
                const maxW = window.innerWidth - (card.offsetLeft || 0);
                const maxH = window.innerHeight - (card.offsetTop || 0);
                w = Math.min(w, Math.max(240, maxW));
                h = Math.min(h, Math.max(120, maxH));

                        const resp = await fetch(url, { headers });
                        if (resp.ok) {
                            data = await resp.json();

                    activePlayersListEl.innerHTML = '<div class="active-player-meta">Unable to load players (' + lastErr + ').</div>';

        async function loadCommunity() {
            if (!communityId) {
                return;
            }
            try {
                const { data: { user } } = await localSupabase.auth.getUser();
                if (!user) {
                    return;
                }
                currentUser = user;
                const displayName = (user.email || "").split("@")[0].split(/[._-]/)[0];
                if (displayName) {
                    shiftNameEl.textContent = "Hey, " + displayName.charAt(0).toUpperCase() + displayName.slice(1) + "!";
                }
                const { data, error } = await localSupabase
                    .from("communities")
                    .select("*")
                    .eq("id", communityId)
                    .maybeSingle();
                if (error) {
                    return;
                }
                if (!data) {
                    return;
                }
                const topbarServerName = document.getElementById("topbarServerName");
                if (topbarServerName) topbarServerName.textContent = data.name || "Community";
                const isCreator = data.creator_email === user.email;
                let isManagement = false;
                if (user.id) {
                    try {
                        const { data: u } = await localSupabase
                            .from("users")
                            .select("department")
                            .eq("id", user.id)
                            .maybeSingle();
                        isManagement = !!(u && (u.department || "").trim() === "Management");
                    } catch (e) {}
                }
                let hasModRole = false;
                if (!isCreator && !isManagement && user.id) {
                    try {
                        const { data: assignments } = await localSupabase
                            .from("member_roles")
                            .select("role_id")
                            .eq("community_id", communityId)
                            .eq("user_id", user.id);
                        if (Array.isArray(assignments) && assignments.length > 0) {
                            const roleIds = assignments.map(r => r.role_id);
                            const { data: rolesData } = await localSupabase
                                .from("roles")
                                .select("permissions")
                                .in("id", roleIds);
                            hasModRole = (rolesData || []).some(r => {
                                const perms = ((r.permissions || "").split(",").map(p => p.trim()));
                                return perms.includes("manage") || perms.includes("moderate") || perms.includes("admin") || perms.includes("full");
                            });
                        }
                    } catch (e) {}
                }
                const isAllowed = isCreator || isManagement || hasModRole;
                if (!isAllowed) {
                    renderShift();
                    loadActiveStaff();
                    return;
                }
                modToolsOffDutyEnabled = !!(data.mod_tools_off_duty);
                erlcApiKey = data.erlc_api_key || "";
                if (!erlcApiKey) {

                }
                const managementBadge = document.getElementById("managementBadge");

                if (user.email === "oceanviewrp1@gmail.com") {
                    if (managementBadge) managementBadge.style.display = "inline-block";

                } else {

                }
                try {
                    const { data: activeShift } = await localSupabase
                        .from("staff_shifts")
                        .select("*")
                        .eq("community_id", communityId)
                        .eq("user_id", user.id)
                        .is("ended_at", null)
                        .order("started_at", { ascending: false })
                        .limit(1)
                        .maybeSingle();

            }

            loadActivePlayers();
        }

        async function sendErkMessage(message) {
            const res = await fetch("/api/erlc/v2/server/command", {
                method: "POST",
                headers: {
                    "server-key": erlcApiKey,
                    "Content-Type": "application/json",
                    "Accept": "application/json"
                },
                body: JSON.stringify({ command: ":m " + message })
            });
            const text = await res.text().catch(() => "");
            if (!res.ok) {
                let detail = "HTTP " + res.status + (text ? " " + text : "");
                try {
                    const j = JSON.parse(text);
                    if (j && j.debug) {
                        detail = "HTTP " + (j.erlcStatus || res.status) +
                            " | method=" + j.debug.method +
                            " | target=" + j.debug.target +
                            " | bodyLen=" + j.debug.bodyLength +
                            " | keySent=" + j.debug.hasServerKey +
                            " | erlcSays=" + (j.erlcBody || "(empty)");
                    }
                } catch (e) {}
                throw new Error(detail);
            }
            try { return JSON.parse(text); } catch (e) { return {}; }
        }

            if (e.key === "Escape" && toolboxModal && toolboxModal.classList.contains("open")) {
                closeToolboxModal();
            }
        });

        loadCommunity();
    </script>
</body>
</html>
