<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rosters - PulseCAD</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f8fafc;
            color: #1a202c;
            min-height: 100vh;
        }

        .rost-status {
            position: fixed;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            display: none;
            z-index: 1000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
        }

        .rost-status.error {
            background: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
            display: block;
        }

        .rost-status.success {
            background: #f0fdf4;
            color: #166534;
            border: 1px solid #bbf7d0;
            display: block;
        }

        .rost-toolbar {
            position: sticky;
            top: 0;
            z-index: 900;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            padding: 16px 32px;
            background: #ffffff;
            border-bottom: 1px solid #e2e8f0;
        }

        .rost-crumb { font-size: 12px; color: #94a3b8; }

        .rost-title { font-size: 20px; font-weight: 700; color: #0f172a; }

        .rost-actions { display: flex; gap: 8px; flex-wrap: wrap; }

        .btn {
            padding: 8px 14px;
            border-radius: 999px;
            border: 1px solid #e2e8f0;
            background: #ffffff;
            color: #0f172a;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
        }

        .btn:hover { background: #f1f5f9; }

        .btn.primary { background: #2563eb; color: #ffffff; border-color: #2563eb; }
        .btn.primary:hover { background: #1d4ed8; }

        .btn.sm { padding: 5px 12px; font-size: 12px; }

        .btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .rost-main {
            max-width: 900px;
            margin: 0 auto;
            padding: 24px 32px 80px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .rost-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 18px 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.04);
        }

        .rost-card-head {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .rost-slot {
            flex: 0 0 auto;
            width: 26px;
            height: 26px;
            border-radius: 8px;
            background: #eff6ff;
            color: #1d4ed8;
            font-size: 12px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .rost-name-input {
            flex: 1;
            min-width: 0;
            font-size: 17px;
            font-weight: 700;
            color: #0f172a;
            border: 1px solid transparent;
            border-radius: 10px;
            padding: 5px 8px;
            outline: none;
            font-family: inherit;
        }

        .rost-name-input:hover { border-color: #e2e8f0; }

        .rost-name-input:focus {
            border-color: #2563eb;
            background: #f8fafc;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .rost-count {
            font-size: 12px;
            color: #94a3b8;
            font-weight: 600;
            white-space: nowrap;
        }

        .rost-members {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 2px 16px;
            margin-bottom: 12px;
        }

        .rost-member {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 2px;
            font-size: 13px;
            color: #334155;
        }

        .rost-member-email {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .rost-member input[type="checkbox"] { cursor: pointer; flex: 0 0 auto; }

        .rost-card-foot {
            display: flex;
            justify-content: flex-end;
            border-top: 1px solid #f1f5f9;
            padding-top: 12px;
        }

        .rost-empty { font-size: 13px; color: #94a3b8; padding: 10px 0; }

        .rost-picker-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            width: 100%;
            text-align: left;
            padding: 12px 14px;
            margin-bottom: 8px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            background: #ffffff;
            color: #0f172a;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
        }

        .rost-picker-item:hover { background: #f8fafc; border-color: #94a3b8; }

        .rost-picker-go { font-size: 12px; font-weight: 600; color: #2563eb; flex: 0 0 auto; }

        .rost-fullscreen-msg {
            max-width: 600px;
            margin: 90px auto;
            text-align: center;
            font-size: 16px;
            color: #475569;
            padding: 0 20px;
        }

        .rost-fullscreen-msg .rost-msg-detail {
            display: block;
            margin-top: 10px;
            font-size: 12px;
            color: #94a3b8;
            word-break: break-word;
        }

        .rost-fullscreen-msg .btn { margin-top: 18px; }

        .rost-footer {
            position: fixed;
            bottom: 10px;
            left: 12px;
            padding: 2px 6px;
            font-size: 11px;
            color: #94a3b8;
            background: transparent;
            z-index: 500;
            pointer-events: none;
        }

        .rost-footer strong { color: #475569; font-weight: 700; }

        @media (max-width: 860px) {
            .rost-main { padding: 20px 16px 80px; }
            .rost-toolbar { padding: 14px 16px; }
        }
    </style>
</head>
<body>
    <div class="rost-status" id="rostStatus"></div>

    <div id="fullscreenMsg" class="rost-fullscreen-msg" style="display:none;">
        <div id="fullscreenText"></div>
        <span class="rost-msg-detail" id="fullscreenDetail"></span>
        <button type="button" class="btn" id="retryBtn" style="display:none;">Retry</button>
    </div>

    <div class="rost-toolbar" id="rostToolbar" style="display:none;">
        <div>
            <div class="rost-crumb" id="rostCrumb"></div>
            <div class="rost-title">Rosters</div>
        </div>
        <div class="rost-actions">
            <button type="button" class="btn" id="backBtn">&#8592; Back</button>
        </div>
    </div>

    <div class="rost-main" id="rostMain" style="display:none;">
        <div class="rost-card" id="rostPickerCard" style="display:none;">
            <div class="rost-card-head"><div class="rost-title">Choose a community</div></div>
            <div id="rostPickerList"></div>
        </div>
        <div id="rostRosterCards"></div>
    </div>

    <div class="rost-footer" id="rostFooter">Powered by <strong>PulseCAD</strong></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = "https://zwdogalwbczdtvxvhrfd.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp3ZG9nYWx3YmN6ZHR2eHZocmZkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM2NTA2MjQsImV4cCI6MjA5OTIyNjYyNH0.baPVVTtW0d3FDC2pTd1P3d5aoIc2FZkaD-6bBvDPFWw";

        const ROSTER_SLOTS = 5;

        const params = new URLSearchParams(window.location.search);
        let communityId = params.get("communityId");
        const rosterIdParam = params.get("id");

        const statusEl = document.getElementById("rostStatus");
        const layoutToolbar = document.getElementById("rostToolbar");
        const layoutMain = document.getElementById("rostMain");
        const fullscreenMsg = document.getElementById("fullscreenMsg");
        const fullscreenText = document.getElementById("fullscreenText");
        const fullscreenDetail = document.getElementById("fullscreenDetail");
        const retryBtn = document.getElementById("retryBtn");
        const rostCrumb = document.getElementById("rostCrumb");
        const rostRosterCards = document.getElementById("rostRosterCards");
        const rostPickerCard = document.getElementById("rostPickerCard");
        const rostPickerList = document.getElementById("rostPickerList");
        const rostFooter = document.getElementById("rostFooter");
        const backBtn = document.getElementById("backBtn");

        let localSupabase = null;
        let communityName = "";
        let rosters = [];
        let members = [];
        let memberIdsByRoster = new Map();

        try {
            if (typeof window.supabase !== "undefined") {
                localSupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            }
        } catch (err) {
            console.error("Supabase init failed:", err);
        }

        function showStatus(message, type) {
            if (!statusEl) return;
            statusEl.className = "rost-status " + (type || "error");
            statusEl.textContent = message;
            if (type === "success") {
                setTimeout(() => { if (statusEl) statusEl.style.display = "none"; }, 2000);
            }
        }

        function showFullscreenMessage(message, detail, showRetry) {
            if (fullscreenMsg) {
                if (fullscreenText) fullscreenText.textContent = message;
                if (fullscreenDetail) fullscreenDetail.textContent = detail || "";
                if (retryBtn) retryBtn.style.display = showRetry ? "inline-block" : "none";
                fullscreenMsg.style.display = "block";
            }
            if (rostFooter) rostFooter.style.display = "none";
        }

        function escapeHtml(text) {
            if (text === null || text === undefined) return "";
            const div = document.createElement("div");
            div.textContent = String(text);
            return div.innerHTML;
        }

        function sleep(ms) {
            return new Promise((resolve) => setTimeout(resolve, ms));
        }

        if (backBtn) {
            backBtn.addEventListener("click", () => {
                if (window.history.length > 1) window.history.back();
                else window.close();
            });
        }

        // A freshly opened tab starts with an empty in-memory auth state; supabase-js
        // only recovers the persisted session asynchronously. Polling getSession()
        // avoids treating a not-yet-loaded session as "logged out" and then failing
        // every RLS-protected query.
        async function waitForAuthUser(timeoutMs) {
            const deadline = Date.now() + (timeoutMs || 10000);
            let user = null;

            while (Date.now() < deadline) {
                try {
                    const { data } = await localSupabase.auth.getSession();
                    if (data && data.session && data.session.user) {
                        user = data.session.user;
                    } else {
                        const res = await localSupabase.auth.getUser();
                        if (res && res.data && res.data.user) user = res.data.user;
                    }
                } catch (err) {
                    console.warn("Session probe failed:", err);
                }

                if (user) return user;
                await sleep(300);
            }

            return null;
        }

        async function hasRostersAccess(communityIdParam, user) {
            if (!user) return false;
            try {
                const { data: community } = await localSupabase
                    .from("communities")
                    .select("creator_email")
                    .eq("id", communityIdParam)
                    .maybeSingle();
                if (community && community.creator_email === user.email) return true;

                const { data: roleAssignments } = await localSupabase
                    .from("member_roles")
                    .select("role_id")
                    .eq("community_id", communityIdParam)
                    .eq("user_id", user.id);
                if (!Array.isArray(roleAssignments) || roleAssignments.length === 0) return false;

                const { data: rolesData } = await localSupabase
                    .from("roles")
                    .select("permissions")
                    .in("id", roleAssignments.map((r) => r.role_id));
                return (rolesData || []).some((r) => {
                    const perms = (r.permissions || "").split(",").map((p) => p.trim());
                    return perms.includes("rosters");
                });
            } catch (err) {
                console.error("Roster access check failed:", err);
                return false;
            }
        }

        // ---------- data ----------

        function fetchRosterRows(communityIdParam) {
            return localSupabase
                .from("rosters")
                .select("*")
                .eq("community_id", communityIdParam)
                .order("created_at", { ascending: true });
        }

        // Every community gets exactly ROSTER_SLOTS rosters, created on first open.
        async function ensureRosterSlots(communityIdParam) {
            let { data, error } = await fetchRosterRows(communityIdParam);
            if (error) throw new Error(error.message);

            let rows = Array.isArray(data) ? data : [];
            if (rows.length >= ROSTER_SLOTS) return rows.slice(0, ROSTER_SLOTS);

            const missing = [];
            for (let i = rows.length; i < ROSTER_SLOTS; i++) {
                missing.push({
                    community_id: communityIdParam,
                    name: "Roster " + (i + 1),
                    created_at: new Date().toISOString()
                });
            }

            const { error: insertError } = await localSupabase.from("rosters").insert(missing);
            if (insertError) {
                showStatus("Could not create the remaining rosters: " + insertError.message, "error");
                return rows;
            }

            const recheck = await fetchRosterRows(communityIdParam);
            if (!recheck.error && Array.isArray(recheck.data)) {
                rows = recheck.data;
            } else {
                rows = rows.concat(missing.map((m, i) => ({
                    id: "pending-" + (rows.length + i),
                    name: m.name,
                    community_id: communityIdParam
                })));
            }
            return rows.slice(0, ROSTER_SLOTS);
        }

        async function loadAll() {
            rosters = await ensureRosterSlots(communityId);

            const { data: membersData } = await localSupabase
                .from("members")
                .select("*")
                .eq("community_id", communityId)
                .order("email");
            members = Array.isArray(membersData) ? membersData : [];

            const { data: linkData } = await localSupabase
                .from("roster_members")
                .select("roster_id, member_id")
                .in("roster_id", rosters.map((r) => r.id));

            memberIdsByRoster = new Map();
            rosters.forEach((r) => memberIdsByRoster.set(r.id, new Set()));
            (Array.isArray(linkData) ? linkData : []).forEach((row) => {
                const set = memberIdsByRoster.get(row.roster_id);
                if (set) set.add(row.member_id);
            });

            renderRosters();
        }

        // ---------- render ----------

        function selectedFor(rosterId) {
            return memberIdsByRoster.get(rosterId) || new Set();
        }

        function renderRosters() {
            if (!rostRosterCards) return;

            if (rosters.length === 0) {
                rostRosterCards.innerHTML = '<div class="rost-card"><div class="rost-empty">No rosters yet.</div></div>';
                return;
            }

            rostRosterCards.innerHTML = rosters.map((r, index) => {
                const selected = selectedFor(r.id);
                const list = members.length === 0
                    ? '<div class="rost-empty">This community has no members yet.</div>'
                    : members.map((m) => `
                        <label class="rost-member">
                            <input type="checkbox" class="rost-member-checkbox" data-roster-id="${escapeHtml(r.id)}" data-member-id="${escapeHtml(m.id)}" ${selected.has(m.id) ? "checked" : ""} />
                            <span class="rost-member-email">${escapeHtml(m.email || "Unknown")}</span>
                        </label>
                    `).join("");

                return `
                    <div class="rost-card">
                        <div class="rost-card-head">
                            <div class="rost-slot">${index + 1}</div>
                            <input type="text" class="rost-name-input" data-roster-id="${escapeHtml(r.id)}" value="${escapeHtml(r.name || "")}" placeholder="Roster name" aria-label="Roster ${index + 1} name" maxlength="60" />
                            <div class="rost-count">${selected.size} of ${members.length}</div>
                        </div>
                        <div class="rost-members">${list}</div>
                        <div class="rost-card-foot">
                            <button type="button" class="btn primary sm" data-save-roster="${escapeHtml(r.id)}">Save Roster ${index + 1}</button>
                        </div>
                    </div>
                `;
            }).join("");

            rostRosterCards.querySelectorAll(".rost-member-checkbox").forEach((cb) => {
                cb.addEventListener("change", () => {
                    const rosterId = cb.getAttribute("data-roster-id");
                    const memberId = cb.getAttribute("data-member-id");
                    if (!rosterId || !memberId) return;
                    const set = selectedFor(rosterId);
                    if (cb.checked) set.add(memberId);
                    else set.delete(memberId);
                    updateCount(rosterId);
                });
            });

            rostRosterCards.querySelectorAll("[data-save-roster]").forEach((btn) => {
                btn.addEventListener("click", () => saveRoster(btn.getAttribute("data-save-roster"), btn));
            });
        }

        function updateCount(rosterId) {
            const card = document.querySelector('.rost-name-input[data-roster-id="' + rosterId + '"]');
            if (!card) return;
            const countEl = card.parentElement ? card.parentElement.querySelector(".rost-count") : null;
            if (countEl) {
                countEl.textContent = selectedFor(rosterId).size + " of " + members.length;
            }
        }

        // ---------- save ----------

        async function saveRoster(rosterId, btn) {
            const nameInput = rostRosterCards.querySelector('.rost-name-input[data-roster-id="' + rosterId + '"]');
            const newName = nameInput ? nameInput.value.trim() : "";
            if (!newName) {
                showStatus("Roster name cannot be empty.", "error");
                return;
            }

            if (btn) { btn.disabled = true; btn.textContent = "Saving..."; }

            const { error: nameError } = await localSupabase
                .from("rosters")
                .update({ name: newName, updated_at: new Date().toISOString() })
                .eq("id", rosterId);
            if (nameError) {
                if (btn) { btn.disabled = false; btn.textContent = "Save"; }
                showStatus("Failed to rename roster: " + nameError.message, "error");
                return;
            }

            const { error: clearError } = await localSupabase
                .from("roster_members")
                .delete()
                .eq("roster_id", rosterId);
            if (clearError) {
                if (btn) { btn.disabled = false; btn.textContent = "Save"; }
                showStatus("Failed to update members: " + clearError.message, "error");
                return;
            }

            const memberIds = Array.from(selectedFor(rosterId));
            if (memberIds.length > 0) {
                const { error: insertError } = await localSupabase
                    .from("roster_members")
                    .insert(memberIds.map((memberId) => ({
                        roster_id: rosterId,
                        member_id: memberId
                    })));
                if (insertError) {
                    if (btn) { btn.disabled = false; btn.textContent = "Save"; }
                    showStatus("Failed to update members: " + insertError.message, "error");
                    return;
                }
            }

            const local = rosters.find((r) => r.id === rosterId);
            if (local) local.name = newName;
            if (btn) { btn.disabled = false; btn.textContent = "Save"; }
            showStatus("Roster saved.", "success");
        }

        // ---------- community picker ----------

        function hideAllViews() {
            if (layoutToolbar) layoutToolbar.style.display = "none";
            if (layoutMain) layoutMain.style.display = "none";
            if (rostPickerCard) rostPickerCard.style.display = "none";
        }

        async function showCommunityPicker() {
            if (!rostPickerList) return;
            const user = await waitForAuthUser(2000);
            if (!user) {
                showFullscreenMessage("Please log in to view rosters.", "No active session in this tab.", true);
                return;
            }

            const { data, error } = await localSupabase
                .from("communities")
                .select("id, name, creator_email")
                .eq("creator_email", user.email);

            if (error) {
                rostPickerList.innerHTML = '<div class="rost-empty">Failed to load your communities.</div>';
            } else if (!Array.isArray(data) || data.length === 0) {
                rostPickerList.innerHTML = '<div class="rost-empty">You do not own any communities.</div>';
            } else {
                rostPickerList.innerHTML = data.map((c) => `
                    <button type="button" class="rost-picker-item" data-community-id="${escapeHtml(c.id)}">
                        <span>${escapeHtml(c.name || "Community")}</span>
                        <span class="rost-picker-go">Open &#8594;</span>
                    </button>
                `).join("");

                rostPickerList.querySelectorAll("[data-community-id]").forEach((b) => {
                    b.addEventListener("click", () => {
                        communityId = b.getAttribute("data-community-id");
                        const url = new URL(window.location.href);
                        url.searchParams.set("communityId", communityId);
                        url.searchParams.delete("id");
                        window.history.replaceState({}, "", url.toString());
                        hideAllViews();
                        init();
                    });
                });
            }

            if (rostPickerCard) rostPickerCard.style.display = "block";
            if (layoutMain) layoutMain.style.display = "block";
        }

        async function resolveCommunity() {
            if (communityId) return true;

            // Support old per-roster links: derive the community from the roster id.
            if (rosterIdParam) {
                const { data } = await localSupabase
                    .from("rosters")
                    .select("community_id")
                    .eq("id", rosterIdParam)
                    .limit(1)
                    .maybeSingle();
                if (data && data.community_id) {
                    communityId = data.community_id;
                    const url = new URL(window.location.href);
                    url.searchParams.set("communityId", communityId);
                    url.searchParams.delete("id");
                    window.history.replaceState({}, "", url.toString());
                    return true;
                }
            }

            return false;
        }

        async function init() {
            if (!localSupabase) {
                showFullscreenMessage("Service unavailable.");
                return;
            }

            if (fullscreenMsg) fullscreenMsg.style.display = "none";
            hideAllViews();

            try {
                // Wait for the persisted session to finish loading before any
                // RLS-protected query, otherwise PostgREST answers as an anonymous
                // role and every row looks missing.
                const user = await waitForAuthUser();

                if (!user) {
                    showFullscreenMessage("Please log in to view rosters.", "No active session in this tab.", true);
                    return;
                }

                const resolved = await resolveCommunity();
                if (!resolved) {
                    await showCommunityPicker();
                    return;
                }

                if (!await hasRostersAccess(communityId, user)) {
                    showFullscreenMessage("You do not have access to these rosters.");
                    return;
                }

                try {
                    const { data: community } = await localSupabase
                        .from("communities")
                        .select("name, pro")
                        .eq("id", communityId)
                        .maybeSingle();
                    communityName = (community && community.name) || "";
                    if (rostFooter) rostFooter.style.display = community && community.pro === true ? "none" : "block";
                } catch (err) {
                    console.error("Community lookup failed:", err);
                }

                document.title = (communityName ? communityName + " - Rosters" : "Rosters") + " - PulseCAD";
                if (rostCrumb) rostCrumb.textContent = communityName || "";
                if (layoutToolbar) layoutToolbar.style.display = "flex";
                if (layoutMain) layoutMain.style.display = "block";

                await loadAll();
            } catch (err) {
                console.error("Init failed:", err);
                showFullscreenMessage("Failed to load rosters.", (err && err.message) || String(err), true);
            }
        }

        if (retryBtn) {
            retryBtn.addEventListener("click", () => {
                retryBtn.style.display = "none";
                init();
            });
        }

        init();
    </script>
</body>
</html>
