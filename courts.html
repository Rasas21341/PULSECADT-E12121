<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Courts</title>
<style>
    :root {
        --bg: #040a12;
        --bg-2: #07141d;
        --panel: rgba(16, 20, 28, 0.9);
        --panel-2: rgba(18, 25, 36, 0.96);
        --panel-3: rgba(14, 17, 24, 0.9);
        --border: rgba(132, 152, 177, 0.18);
        --border-soft: rgba(140, 160, 180, 0.12);
        --text: #edf4ff;
        --muted: #9aa9b8;
        --muted-2: #73829a;
        --primary: #e5eefb;
        --accent: #e3bb5b;
        --badge: #f7d485;
        --danger: #ff5d5d;
        --success: #38d39f;
        --button: rgba(255,255,255,0.06);
        --button-2: rgba(255,255,255,0.1);
        --shadow: rgba(0, 0, 0, 0.42);
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html, body {
        width: 100%;
        min-height: 100%;
        background: #050a12;
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
        min-height: 100vh;
        position: relative;
        overflow-x: hidden;
    }

    .topbar {
        position: sticky;
        top: 0;
        height: 72px;
        background: rgba(7, 11, 18, 0.86);
        border-bottom: 1px solid rgba(128, 145, 165, 0.18);
        backdrop-filter: none;
        z-index: 10;
    }

    .topbar-inner {
        max-width: 1280px;
        height: 100%;
        margin: 0 auto;
        padding: 0 18px 0 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
    }

    .nav-group {
        display: flex;
        align-items: center;
        gap: 26px;
        min-width: 0;
        flex: 1;
    }

    .nav-item {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 15px;
        font-weight: 600;
        color: rgba(226, 236, 245, 0.9);
        position: relative;
        padding: 21px 0 18px;
        opacity: 0.9;
        white-space: nowrap;
    }

    .nav-item:first-child {
        margin-left: 0;
    }

    .nav-item.active {
        color: #f4f8ff;
    }

    .nav-item.active::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        bottom: -1px;
        height: 2px;
        background: rgba(234, 242, 255, 0.9);
        border-radius: 999px;
    }

    .nav-icon {
        width: 17px;
        height: 17px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: inherit;
    }

    .nav-icon svg {
        width: 100%;
        height: 100%;
        stroke: currentColor;
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
    }

    .badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 18px;
        height: 18px;
        padding: 0 6px;
        font-size: 11px;
        font-weight: 800;
        line-height: 1;
        color: #fff;
        background: linear-gradient(180deg, #ff6a5c, #eb4d47);
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        box-shadow: 0 0 12px rgba(255, 109, 92, 0.35);
    }

    .topbar-actions {
        width: 42px;
        height: 42px;
        border-radius: 10px;
        border: 1px solid rgba(138, 160, 184, 0.18);
        background: rgba(255,255,255,0.02);
        display: flex;
        align-items: center;
        justify-content: center;
        color: rgba(233, 240, 247, 0.9);
    }

    .topbar-actions svg {
        width: 20px;
        height: 20px;
        stroke: currentColor;
        fill: none;
        stroke-width: 2;
    }

    .page {
        max-width: 1280px;
        margin: 26px auto 0;
        padding: 0 24px 68px;
    }

    .layout {
        display: grid;
        grid-template-columns: 430px minmax(0, 1fr);
        gap: 18px;
        min-height: 700px;
        align-items: start;
    }

    .panel {
        background: rgba(14, 18, 24, 0.92);
        border: 1px solid var(--border);
        border-radius: 6px;
        box-shadow: 0 2px 0 rgba(0,0,0,0.3);
    }

    .sidebar {
        padding: 14px 16px 18px;
        min-height: 260px;
    }

    .panel-title {
        font-size: 18px;
        font-weight: 800;
        color: var(--text);
        margin: 2px 0 14px;
        letter-spacing: -0.02em;
    }

    .filter-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 8px;
        background: rgba(255,255,255,0.02);
        border: 1px solid rgba(145, 160, 198, 0.12);
        border-radius: 12px;
        margin-bottom: 14px;
    }

    .filter-pill {
        flex: 1;
        min-width: 0;
        padding: 8px 12px;
        border-radius: 10px;
        text-align: center;
        font-size: 13px;
        font-weight: 700;
        color: rgba(220, 232, 244, 0.8);
        background: transparent;
    }

    .filter-pill.active {
        background: rgba(255,255,255,0.04);
        color: var(--text);
    }

    .warrant-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-top: 10px;
    }

    .warrant-item {
        padding: 14px 14px 12px;
        background: rgba(59, 46, 34, 0.18);
        border: 1px solid rgba(166, 124, 51, 0.22);
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
    }

    .warrant-item .left {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        min-width: 0;
        flex: 1;
    }

    .pin {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #f5c04a;
        display: inline-block;
        margin-top: 8px;
        box-shadow: 0 0 0 3px rgba(245, 192, 74, 0.2);
        flex-shrink: 0;
    }

    .warrant-meta {
        min-width: 0;
    }

    .warrant-address {
        font-size: 16px;
        font-weight: 700;
        color: var(--text);
        line-height: 1.3;
        margin-bottom: 3px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .warrant-sub {
        font-size: 12px;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .warrant-status {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 7px 12px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
        color: rgba(26, 23, 18, 0.95);
        background: rgba(255, 201, 82, 0.92);
        border: 1px solid rgba(245, 192, 74, 0.6);
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.18);
        flex-shrink: 0;
    }

    .main-panel {
        background: rgba(11, 16, 23, 0.82);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 18px 18px 14px;
        min-height: 600px;
        box-shadow: 0 2px 0 rgba(0,0,0,0.3);
    }

    .main-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        padding: 2px 4px 16px;
    }

    .main-head h2 {
        font-size: 18px;
        font-weight: 800;
        color: var(--text);
        letter-spacing: -0.03em;
    }

    .action-row {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .ghost-btn {
        border: 1px solid rgba(138, 160, 184, 0.2);
        background: rgba(255,255,255,0.02);
        color: var(--text);
        font-weight: 700;
        font-size: 13px;
        border-radius: 999px;
        padding: 8px 14px;
    }

    .wait-btn {
        border: 1px solid rgba(170, 149, 89, 0.8);
        background: rgba(214, 173, 79, 0.1);
        color: #f4d58a;
    }

    .document-btn {
        padding-left: 18px;
        padding-right: 18px;
    }

    .info-card {
        background: rgba(14, 18, 25, 0.74);
        border: 1px solid var(--border-soft);
        border-radius: 14px;
        padding: 10px 18px 18px;
    }

    .meta-grid {
        display: grid;
        grid-template-columns: 120px 1fr;
        row-gap: 12px;
        column-gap: 18px;
        align-items: start;
        padding: 8px 0 0;
    }

    .meta-label {
        font-size: 12px;
        line-height: 1.5;
        color: var(--muted-2);
        font-weight: 600;
        text-transform: none;
    }

    .meta-value {
        font-size: 12px;
        line-height: 1.5;
        color: var(--text);
        font-weight: 500;
        text-align: left;
    }

    .meta-value strong {
        font-weight: 700;
    }

    .detail-block {
        margin-top: 18px;
        padding-top: 18px;
        border-top: 1px solid rgba(150, 168, 189, 0.12);
    }

    .detail-title {
        font-size: 13px;
        font-weight: 700;
        color: var(--muted);
        margin-bottom: 10px;
    }

    .detail-text {
        font-size: 13px;
        color: rgba(230, 238, 247, 0.72);
        line-height: 1.6;
    }

    .input-stack {
        margin-top: 18px;
        display: grid;
        gap: 18px;
    }

    .field {
        display: grid;
        gap: 8px;
    }

    .field label {
        font-size: 13px;
        color: var(--muted-2);
        font-weight: 600;
    }

    .field .input-like,
    .field textarea {
        width: 100%;
        background: rgba(255,255,255,0.02);
        border: 1px solid rgba(137, 152, 171, 0.18);
        border-radius: 10px;
        min-height: 38px;
        padding: 11px 12px;
        color: var(--text);
        font-size: 13px;
        font-family: inherit;
        outline: none;
        resize: vertical;
    }

    .field textarea {
        min-height: 86px;
    }

    .field .input-like {
        display: flex;
        align-items: center;
    }

    .field .input-like span {
        opacity: 0.9;
    }

    .decision-box {
        margin-top: 18px;
        padding: 16px 18px 14px;
        border-radius: 14px;
        background: rgba(14, 18, 25, 0.84);
        border: 1px solid rgba(140, 158, 177, 0.16);
    }

    .approve-row {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        margin-top: 0;
    }

    .primary-btn,
    .secondary-btn {
        border: 1px solid rgba(160, 170, 187, 0.18);
        background: rgba(255,255,255,0.04);
        color: var(--text);
        font-size: 15px;
        font-weight: 700;
        border-radius: 10px;
        padding: 12px 22px;
        cursor: pointer;
        min-width: 108px;
    }

    .primary-btn {
        background: linear-gradient(180deg, rgba(231, 239, 244, 0.96), rgba(204, 214, 227, 0.92));
        color: #141b25;
        border-color: rgba(255,255,255,0.28);
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.5), 0 6px 18px rgba(0,0,0,0.2);
    }

    .secondary-btn {
        background: rgba(255,255,255,0.04);
        color: var(--text);
    }

    .status-success {
        margin-top: 18px;
        display: flex;
        justify-content: center;
    }

    .status-pill {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 8px 18px;
        border-radius: 999px;
        background: rgba(50,55,66,0.9);
        border: 1px solid rgba(145, 158, 177, 0.15);
        font-size: 12px;
        font-weight: 700;
        color: rgba(236, 240, 245, 0.82);
    }

    .footer-bar {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        height: 76px;
        background: rgba(8, 12, 18, 0.96);
        border-top: 1px solid rgba(128, 145, 165, 0.18);
    }

    .footer-inner {
        max-width: 1280px;
        margin: 0 auto;
        height: 100%;
        padding: 0 22px 0 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
    }

    .user-block {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .avatar {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: linear-gradient(180deg, #dfe9ff, #a9c4f0);
        color: #0b1420;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        font-weight: 800;
        border: 1px solid rgba(255,255,255,0.2);
    }

    .user-name {
        font-size: 14px;
        font-weight: 700;
        color: var(--text);
        line-height: 1.2;
    }

    .user-role {
        font-size: 12px;
        color: var(--muted);
        line-height: 1.2;
    }

    .status-strip {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 600;
    }

    .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #42d98d;
        box-shadow: 0 0 0 3px rgba(66, 217, 141, 0.18);
    }

    .time-wrap {
        display: flex;
        align-items: center;
        gap: 18px;
        color: var(--text);
        font-weight: 700;
        font-size: 14px;
    }

    .time-wrap .clock {
        font-size: 13px;
        color: var(--text);
        letter-spacing: 0.02em;
    }

    .time-wrap .date {
        font-size: 12px;
        color: var(--muted);
        letter-spacing: 0.04em;
    }

    @media (max-width: 980px) {
        .layout {
            grid-template-columns: 1fr;
        }

        .page {
            padding-left: 16px;
            padding-right: 16px;
        }

        .nav-group {
            gap: 16px;
            overflow-x: auto;
        }
    }
</style>
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <nav class="nav-group" aria-label="Court navigation">
                <div class="nav-item">
                    <span class="nav-icon">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"></path><path d="M5 9.5V20h14V9.5"></path></svg>
                    </span>
                    <span>Dashboard</span>
                </div>
                <div class="nav-item active">
                    <span>Warrants</span>
                    <span class="badge">1</span>
                </div>
                <div class="nav-item">
                    <span>Hearing</span>
                </div>
                <div class="nav-item">
                    <span>Requests</span>
                </div>
                <div class="nav-item">
                    <span>Records</span>
                </div>
                <div class="nav-item">
                    <span>Duty</span>
                </div>
            </nav>

            <div class="topbar-actions" aria-label="Menu">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
            </div>
        </div>
    </header>

    <main class="page">
        <div class="layout">
            <aside class="panel sidebar">
                <h3 class="panel-title">Warrants</h3>

                <div class="filter-row" aria-label="Warrant filters">
                    <div class="filter-pill active">Waiting 1</div>
                    <div class="filter-pill">Valid 3</div>
                    <div class="filter-pill">Done 1</div>
                </div>

                <div class="warrant-list">
                </div>
            </aside>

            <section class="main-panel">
            </section>
        </div>
    </main>

    <footer class="footer-bar">
        <div class="footer-inner">
            <div class="user-block">
                <div class="avatar">E</div>
                <div>
                    <div class="user-name">Eleanor Price</div>
                    <div class="user-role">Liberty County Superior Court • J-2</div>
                </div>
            </div>

            <div class="status-strip">
                <span class="dot" aria-hidden="true"></span>
                <span>Connected</span>
                <span>Shift 01:14:12</span>
            </div>

            <div class="time-wrap">
                <span class="clock" id="courtsClock">21:14</span>
                <span class="date" id="courtsDate">03/10/2026</span>
            </div>
        </div>
    </footer>

    <script>
        function formatClock(d) {
            const pad = n => String(n).padStart(2, '0');
            return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
        }

        function formatDate(d) {
            const pad = n => String(n).padStart(2, '0');
            return `${pad(d.getMonth() + 1)}/${pad(d.getDate())}/${d.getFullYear()}`;
        }

        (function () {
            const clockEl = document.getElementById('courtsClock');
            const dateEl = document.getElementById('courtsDate');

            function tick() {
                const now = new Date();
                if (clockEl) clockEl.textContent = formatClock(now);
                if (dateEl) dateEl.textContent = formatDate(now);
            }

            tick();
            setInterval(tick, 1000);
        })();
    </script>
</body>
</html>
