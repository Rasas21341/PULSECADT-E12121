        .container {

            color: #0f172a;

        }

        .status.success {

            color: #166534;
            border: 1px solid #bbf7d0;

            background: #ffffff;

            border-bottom: 1px solid #f1f5f9;
        }

        th {

            color: #64748b;

            font-size: 13px;

        }

        .empty {

            color: #ffffff;

        .icon-btn {

            background: transparent;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 8px;

            font-size: 14px;
            font-weight: 600;

            color: #ffffff;

            border-radius: 10px;
            border: 1px solid #e2e8f0;
            background: #ffffff;
            color: #0f172a;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        .master-actions {
            margin-top: 28px;
            padding: 20px;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            background: #ffffff;
        }

        .master-actions h2 {
            font-size: 18px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 6px;
        }

        .master-actions p {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 16px;
        }

        .master-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 12px 0;
            border-top: 1px solid #f1f5f9;
        }

        .master-row-label {
            font-size: 15px;
            font-weight: 600;
            color: #0f172a;
        }

        .master-row-sub {
            font-size: 13px;
            color: #64748b;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 28px;
            flex-shrink: 0;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            inset: 0;
            background: #cbd5e1;
            border-radius: 999px;
            transition: background .15s ease;
        }

        .slider::before {
            content: "";
            position: absolute;
            height: 22px;
            width: 22px;
            left: 3px;
            top: 3px;
            background: #ffffff;
            border-radius: 50%;
            transition: transform .15s ease;
        }

        .switch input:checked + .slider {
            background: #2563eb;
        }

        .switch input:checked + .slider::before {
            transform: translateX(22px);
        }

            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .codes-section h2 {
            font-size: 18px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 6px;
        }

        .codes-section p {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 16px;
        }

            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
            font-size: 14px;
            color: #1a202c;
            background: #f8fafc;

        .codes-search-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        .codes-search-input {
            flex: 1;
            min-width: 200px;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
            font-size: 14px;
            color: #1a202c;

        .codes-list-section {

            font-weight: 700;
            color: #0f172a;

        .codes-count {

            margin-bottom: 10px;

            font-size: 12px;
            text-transform: uppercase;

        .codes-list-table td {
            color: #334155;
            word-break: break-all;
            font-family: monospace;
        }

        .codes-used-no {
            color: #16a34a;
            font-weight: 700;
        }

        .codes-used-yes {
            color: #dc2626;
            font-weight: 700;
        }

        .delete-code-btn {
            background: #dc2626;
            color: #ffffff;
            border: none;
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .delete-code-btn:hover {
            background: #b91c1c;
        }

        .delete-code-btn.unban-btn {
            padding: 2px 8px;
            font-size: 10px;
        }

        .give-key-btn {
            background: #16a34a;
            color: #ffffff;
            border: none;
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .give-key-btn:hover {
            background: #15803d;
        }

        .view-key-btn {
            background: #ffffff;
            color: #0f172a;
            border: 1px solid #cbd5e1;
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .view-key-btn:hover {
            background: #f1f5f9;
            border-color: #94a3b8;
        }

        .key-row-actions {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
        }

        .key-modal {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.55);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 1000;
        }

        .key-modal-card {
            background: #ffffff;
            border-radius: 16px;
            width: 100%;
            max-width: 560px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.3);
        }

        .key-modal-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 18px 20px;
            border-bottom: 1px solid #e2e8f0;
        }

        .key-modal-title {
            font-size: 15px;
            font-weight: 700;
            color: #0f172a;
            word-break: break-word;
        }

        .key-modal-close {
            background: none;
            border: none;
            font-size: 22px;
            line-height: 1;
            color: #94a3b8;
            cursor: pointer;
            padding: 0 4px;
        }

        .key-modal-close:hover { color: #0f172a; }

        .key-modal-body {
            padding: 18px 20px;
            overflow-y: auto;
        }

        .key-view-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 10px 0;
            border-bottom: 1px solid #f1f5f9;
            font-size: 13px;
        }

        .key-view-row:last-child { border-bottom: none; }

        .key-view-code {
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-weight: 700;
            color: #0f172a;
            word-break: break-all;
        }

        .key-view-date { color: #94a3b8; font-size: 12px; white-space: nowrap; }

        .key-copy-btn {
            border: 1px solid #cbd5e1;
            background: #ffffff;
            border-radius: 6px;
            padding: 3px 8px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            flex: 0 0 auto;
        }

        .key-copy-btn:hover { background: #f1f5f9; }
    </style></head>
<body>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        const SUPABASE_URL = "https://zwdogalwbczdtvxvhrfd.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp3ZG9nYWx3YmN6ZHR2eHZocmZkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM2NTA2MjQsImV4cCI6MjA5OTIyNjYyNH0.baPVVTtW0d3FDC2pTd1P3d5aoIc2FZkaD-6bBvDPFWw";

        const statusEl = document.getElementById("status");
        const contentEl = document.getElementById("content");
        const pageTitle = document.getElementById("pageTitle");
        const serversBtn = document.getElementById("serversBtn");
        const staffUsersBtn = document.getElementById("staffUsersBtn");
        const applicationsBtn = document.getElementById("applicationsBtn");
        const codesBtn = document.getElementById("codesBtn");
        const supportPanelNavBtn = document.getElementById("supportPanelNavBtn");
        const suggestionsNavBtn = document.getElementById("suggestionsNavBtn");
        const developmentBoardBtn = document.getElementById("developmentBoardBtn");
        const masterActionsBtn = document.getElementById("masterActionsBtn");
        const customerSupportLabel = document.getElementById("customerSupportLabel");
        const developmentTeamLabel = document.getElementById("developmentTeamLabel");

        let localSupabase = null;
        try {
            if (typeof window.supabase !== "undefined") {
                localSupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            }
        } catch (err) {
            console.error("Supabase init failed:", err);
        }

        function showStatus(message, type) {
            if (!statusEl) return;
            statusEl.className = "status " + (type || "");
            statusEl.textContent = message;
        }

        async function ensureStaff() {
            if (!localSupabase) {
                showStatus("Authentication service unavailable.", "error");
                return { allowed: false };
            }
            try {
                const { data: { user } } = await localSupabase.auth.getUser();
                
                // Check Discord user in localStorage for moderation access
                const discordUser = JSON.parse(localStorage.getItem("discord_user") || "null");
                const discordUsername = (discordUser?.username || discordUser?.global_name || "").toLowerCase();
                const discordDiscriminator = discordUser?.discriminator && discordUser?.discriminator !== "0" ? "#" + discordUser.discriminator : "";
                const fullDiscordName = discordUsername + discordDiscriminator;
                if (fullDiscordName === "theboyrp1234_offical1" || fullDiscordName === "theboyrp1234_official1") {
                    return { allowed: true, department: "Management" };
                }
                
                if (!user) {
                    showStatus("Access denied. Please log in to continue.", "error");
                    return { allowed: false };
                }
                if (user.email === "oceanviewrp1@gmail.com") {
                    return { allowed: true, department: "Management" };
                }
                const { data, error } = await localSupabase
                    .from("users")
                    .select("department")
                    .eq("email", user.email)
                    .maybeSingle();
                if (error) {
                    console.error("Department lookup failed:", error);
                    showStatus("Access denied. Could not verify staff status: " + error.message, "error");
                    return { allowed: false };
                }
                const department = (data?.department || "").trim();
                const normalized = department.toLowerCase().replace(/\s+/g, "");
                const allowedDepts = ["management", "managementassistant", "supportteam", "supportteamlead", "support"];
                if (allowedDepts.includes(normalized)) {
                    return { allowed: true, department };
                }
                showStatus("Access denied. Your department (" + (department || "none") + ") is not authorized for the staff dashboard.", "error");
                return { allowed: false };
            } catch (err) {
                showStatus("An unexpected error occurred.", "error");
                console.error(err);
                return { allowed: false };
            }
        }

        async function getUserDepartment() {
            if (!localSupabase) return "";
            try {
                const { data: { user } } = await localSupabase.auth.getUser();
                if (!user) return "";
                if (user.email === "oceanviewrp1@gmail.com") return "Management";
                const { data } = await localSupabase
                    .from("users")
                    .select("department")
                    .eq("email", user.email)
                    .maybeSingle();
                return data?.department || "";
            } catch (err) {
                console.error("Failed to get department:", err);
                return "";
            }
        }

        async function loadServers() {
            const staff = await ensureStaff();
            if (!staff.allowed) return;
            const userDepartment = staff.department || await getUserDepartment();
            pageTitle.textContent = "Servers";
            contentEl.innerHTML = '<div class="empty">Loading servers...</div>';

            try {
                const { data, error } = await localSupabase
                    .from("communities")
                    .select("*")
                    .order("created_at", { ascending: false });

                if (error) {
                    contentEl.innerHTML = `<div class="empty">Failed to load servers: ${error.message}</div>`;
                    return;
                }

                if (!Array.isArray(data) || data.length === 0) {
                    contentEl.innerHTML = `<div class="empty">No servers found.</div>`;
                    return;
                }

let html = `<input type="text" class="search-box" id="serverSearch" placeholder="Search servers by name, owner, or code..." /><table><tr><th>Join Code</th><th>Name</th><th>Owner</th><th>Created</th><th>Status</th><th>Members Only</th><th>Pro</th><th>Partner</th><th>Actions</th></tr>`;
                const canSuspend = userDepartment !== "Support Team" && userDepartment !== "Support Team Lead";
                const canDelete = userDepartment !== "Support Team" && userDepartment !== "Support Team Lead";
                const canPro = userDepartment !== "Support Team" && userDepartment !== "Support Team Lead";
                const canPartner = userDepartment !== "Support Team" && userDepartment !== "Support Team Lead";
                data.forEach((row) => {
                    const name = (row.name || "N/A").replace(/</g, "<").replace(/>/g, ">");
                    const owner = (row.creator_email || "N/A").replace(/</g, "<").replace(/>/g, ">");
                    const created = row.created_at ? new Date(row.created_at).toLocaleString() : "";
                    const suspended = !!row.suspended;
                    const membersOnly = !!row.members_only;
                    const joinCode = (row.join_code || row.passcode || "-").replace(/</g, "<").replace(/>/g, ">");
                    const statusCell = suspended
                        ? `<span style="display:inline-flex;align-items:center;background:#dc2626;color:#ffffff;border-radius:999px;padding:2px 9px;font-size:10px;font-weight:600;width:auto;">Suspended</span>`
                        : `<span style="display:inline-flex;align-items:center;background:#16a34a;color:#ffffff;border-radius:999px;padding:2px 9px;font-size:10px;font-weight:600;width:auto;">Active</span>`;
                    const membersOnlyCell = membersOnly
                        ? `<span style="display:inline-flex;align-items:center;background:#2563eb;color:#ffffff;border-radius:999px;padding:3px 10px;font-size:11px;font-weight:600;width:auto;">Members Only</span>`
                        : `<span style="color:#94a3b8;font-size:12px;font-weight:600;">Public</span>`;
                    const suspendBtn = canSuspend
                        ? `<button class="verified-btn suspend-server-btn" data-id="${row.id}" data-suspended="${suspended}">${suspended ? "Unsuspend" : "Suspend"}</button>`
                        : "";
                    const deleteBtn = canDelete
                        ? `<button class="verified-btn delete-server-btn" data-id="${row.id}">Delete</button>`
                        : "";
                    const pro = !!row.pro;
                    const proCell = pro
                        ? `<span style="color:#16a34a;font-size:11px;font-weight:600;">Pro</span>`
                        : `<span style="color:#94a3b8;font-size:11px;font-weight:600;">No</span>`;
                    const proToggleBtn = canPro
                        ? `<button class="pro-server-btn" data-id="${row.id}" data-pro="${pro}" style="padding:4px 10px;border-radius:999px;font-size:11px;font-weight:700;cursor:pointer;border:1px solid #16a34a;background:#f0fdf4;color:#166534;">${pro ? "Remove Pro" : "Give Pro"}</button>`
                        : "";
                    const partner = !!row.partner;
                    const partnerToggleBtn = canPartner

                                alert("Access denied. Support cannot assign users to Management.");

                                alert("Access denied. Only Support Team Lead can assign Management Assistant.");

                                alert("Access denied. Management Assistant cannot assign users to Management or Management Assistant.");

                                return;
                            }
                        }

                            // Management can see Management in dropdown but cannot assign it to others
                            if (newDepartment === "Management") {
                                alert("Access denied. Cannot assign Management role through this panel.");
                                select.value = currentDept;
                                return;
                            }

                        const { error } = await localSupabase
                            .from("users")
                            .update({ department: newDepartment })
                            .eq("id", userId);
                        if (error) {
                            alert("Failed to update department: " + error.message);

                contentEl.querySelectorAll(".give-key-btn").forEach((btn) => {

                            alert("Access denied. Management only.");

                        const userEmail = btn.getAttribute("data-email");

                        for (let i = 0; i < 16; i++) {
                            key += chars.charAt(Math.floor(Math.random() * chars.length));
                        }
                        const { error } = await localSupabase
                            .from("premium_keys")
                            .insert([{ key: key, used: true, used_by: userEmail, used_at: new Date().toISOString(), created_at: new Date().toISOString() }]);
                        if (error) {
                            alert("Failed to give key: " + error.message);

                        }
                        alert("Key given successfully: " + key);
                    });
                });

                contentEl.querySelectorAll(".view-key-btn").forEach((btn) => {
                    btn.addEventListener("click", async () => {
                        const dept = await getUserDepartment();
                        if (dept !== "Management" && dept !== "Support Team Lead") {
                            alert("Access denied. Management only.");
                            return;
                        }
                        openKeyModal(btn.getAttribute("data-email"));

            } catch (err) {
                contentEl.innerHTML = `<div class="empty">An unexpected error occurred.</div>`;
                console.error(err);
            }

        const keyModal = document.getElementById("keyModal");
        const keyModalEmail = document.getElementById("keyModalEmail");

        function closeKeyModal() {
            if (keyModal) keyModal.style.display = "none";
        }

        if (keyModalClose) {
            keyModalClose.addEventListener("click", closeKeyModal);
        }

        if (keyModal) {
            keyModal.addEventListener("click", (e) => {
                if (e.target === keyModal) closeKeyModal();

            if (e.key === "Escape" && keyModal && keyModal.style.display !== "none") closeKeyModal();

        async function openKeyModal(userEmail) {
            if (!keyModal) return;
            if (keyModalEmail) keyModalEmail.textContent = userEmail;
            if (keyModalBody) keyModalBody.innerHTML = '<div class="empty">Loading keys...</div>';
            keyModal.style.display = "flex";

            try {
                const { data, error } = await localSupabase
                    .from("premium_keys")
                    .select("id, key, used, used_by, used_at, created_at")
                    .eq("used_by", userEmail)
                    .order("created_at", { ascending: false });

                if (error) {
                    keyModalBody.innerHTML = `<div class="empty">Failed to load keys: ${error.message}</div>`;
                    return;
                }

                const rows = Array.isArray(data) ? data : [];
                if (rows.length === 0) {
                    keyModalBody.innerHTML = '<div class="empty">No keys have been given to this user yet.</div>';
                    return;
                }

                keyModalBody.innerHTML = rows.map((row) => {
                    const code = (row.key || "").replace(/</g, "&lt;").replace(/>/g, "&gt;");
                    const when = row.used_at || row.created_at;
                    const dateText = when ? new Date(when).toLocaleString() : "";
                    return `<div class="key-view-row"><span class="key-view-code">${code}</span><span class="key-view-date">${dateText}</span><button type="button" class="key-copy-btn" data-copy="${code}">Copy</button></div>`;
                }).join("");

                keyModalBody.querySelectorAll("[data-copy]").forEach((btn) => {
                    btn.addEventListener("click", async () => {
                        const code = btn.getAttribute("data-copy");
                        try {
                            await navigator.clipboard.writeText(code);
                            btn.textContent = "Copied";
                        } catch (err) {
                            prompt("Copy the key:", code);
                        }
                        setTimeout(() => { btn.textContent = "Copy"; }, 1500);
                    });
                });
            } catch (err) {
                keyModalBody.innerHTML = '<div class="empty">An unexpected error occurred.</div>';
                console.error(err);
            }
        }

        async function loadCodes() {
            const staff = await ensureStaff();
            if (!staff.allowed) return;
            const dept = (staff.department || "").toLowerCase();
            if (dept !== "management" && dept !== "support team" && dept !== "management assistant") {
                showStatus("Access denied.", "error");
                return;
            }
            pageTitle.textContent = "Codes";
            contentEl.innerHTML = `
                <div class="codes-section">
                    <h2>Premium Key Generator</h2>
                    <p>Generate a new premium key for PulseCAD. Keys start with MDT and are one-time use.</p>
                    <div class="premium-key-display">
                        <input type="text" class="premium-key-input" id="generatedPremiumKey" readonly />
                        <button type="button" class="verified-btn" id="generatePremiumKeyBtn">Generate</button>
                        <button type="button" class="verified-btn" id="copyPremiumKeyBtn">Copy</button>
                    </div>
                </div>
                <div class="codes-list-section">
                    <h3>Existing Keys</h3>
                    <div class="codes-search-row">
                        <input type="text" class="codes-search-input" id="codesSearchInput" placeholder="Search codes..." />
                    </div>
                    <div class="codes-count" id="codesCount"></div>
                    <table class="codes-list-table">
                        <tr><th>Key</th><th>Used</th><th>Created</th><th>Actions</th></tr>
                        <tbody id="codesListBody"><tr><td colspan="4"><div class="empty">Loading...</div></td></tr></tbody>
                    </table>
                </div>
            `;

            const generateKeyBtn = document.getElementById("generatePremiumKeyBtn");
            const copyKeyBtn = document.getElementById("copyPremiumKeyBtn");
            const keyInput = document.getElementById("generatedPremiumKey");
            const searchInput = document.getElementById("codesSearchInput");
            const codesListBody = document.getElementById("codesListBody");
            const codesCount = document.getElementById("codesCount");

            async function renderCodes(filterText = "") {
                if (!codesListBody || !localSupabase) return;
                try {
                    const { data, error } = await localSupabase
                        .from("premium_keys")
                        .select("*")
                        .order("created_at", { ascending: false });
                    if (error) {
                        codesListBody.innerHTML = `<tr><td colspan="4"><div class="empty">Failed to load codes: ${error.message}</div></td></tr>`;
                        return;
                    }
                    const rows = Array.isArray(data) ? data : [];
                    const filtered = filterText
                        ? rows.filter((row) => (row.key || "").toLowerCase().includes(filterText.toLowerCase()))
                        : rows;
                    if (codesCount) codesCount.textContent = `${filtered.length} code${filtered.length === 1 ? '' : 's'} found`;
                    if (filtered.length === 0) {
                        codesListBody.innerHTML = `<tr><td colspan="4"><div class="empty">No codes found.</div></td></tr>`;
                        return;
                    }
                    codesListBody.innerHTML = filtered.map((row) => {
                        const usedText = row.used ? "Yes" : "No";
                        const usedClass = row.used ? "codes-used-yes" : "codes-used-no";
                        const created = row.created_at ? new Date(row.created_at).toLocaleString() : "";
                        return `<tr><td>${(row.key || "").replace(/</g, "&lt;").replace(/>/g, "&gt;")}</td><td class="${usedClass}">${usedText}</td><td>${created}</td><td><button type="button" class="delete-code-btn" data-id="${row.id}">Delete</button></td></tr>`;
                    }).join("");

                    contentEl.querySelectorAll(".delete-code-btn").forEach((btn) => {
                        btn.addEventListener("click", async () => {
                            const id = btn.getAttribute("data-id");
                            if (!confirm("Are you sure you want to delete this code?")) return;
                            const { error } = await localSupabase
                                .from("premium_keys")
                                .delete()
                                .eq("id", id);
                            if (error) {
                                alert("Failed to delete code: " + error.message);
                                return;
                            }
                            renderCodes(searchInput.value.trim());
                        });
                    });
                } catch (err) {
                    codesListBody.innerHTML = `<tr><td colspan="3"><div class="empty">An unexpected error occurred.</div></td></tr>`;
                    console.error(err);
                }
            }

            renderCodes();

            if (searchInput) {
                searchInput.addEventListener("input", () => {
                    renderCodes(searchInput.value.trim());
                });
            }

            if (generateKeyBtn && localSupabase) {
                generateKeyBtn.addEventListener("click", async () => {
                    try {
                        const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
                        let key = "MDT-";
                        for (let i = 0; i < 16; i++) {
                            key += chars.charAt(Math.floor(Math.random() * chars.length));
                        }
                        const { error } = await localSupabase
                            .from("premium_keys")
                            .insert([{ key: key, used: false, created_at: new Date().toISOString() }]);
                        if (error) {
                            alert("Failed to generate premium key: " + error.message);
                            return;
                        }
                        if (keyInput) keyInput.value = key;
                        if (searchInput) renderCodes(searchInput.value.trim());
                    } catch (err) {
                        alert("An unexpected error occurred.");
                        console.error(err);
                    }
                });

        async function loadSuggestions() {
            const staff = await ensureStaff();
            if (!staff.allowed) return;
            const dept = (staff.department || "").toLowerCase();
            if (dept !== "management" && dept !== "support team" && dept !== "support team lead" && dept !== "development team" && dept !== "management assistant") {
                showStatus("Access denied. Management, Support, Development, or Management Assistant only.", "error");
                return;
            }
            pageTitle.textContent = "Suggestions";
            contentEl.innerHTML = `
                <div class="codes-list-section">
                    <h2>User Suggestions</h2>
                    <p>Suggestions submitted through the /suggestionmake page.</p>
                    <div class="codes-search-row">
                        <select class="codes-search-input" id="sugFilterSelect">
                            <option value="">All statuses</option>
                            <option value="open">Open</option>
                            <option value="reviewed">Reviewed</option>
                            <option value="closed">Closed</option>
                        </select>
                        <button type="button" class="verified-btn" id="openSuggestionFormFromListBtn">Open Form</button>
                    </div>
                    <div class="codes-count" id="sugCount"></div>
                    <table class="codes-list-table">
                        <tr><th>Title</th><th>Category</th><th>From</th><th>Submitted</th><th>Status</th><th>Actions</th></tr>
                        <tbody id="sugListBody"><tr><td colspan="6"><div class="empty">Loading...</div></td></tr></tbody>
                    </table>
                </div>
            `;

            const filterSelect = document.getElementById("sugFilterSelect");
            const sugListBody = document.getElementById("sugListBody");
            const sugCount = document.getElementById("sugCount");
            const openSuggestionFormFromListBtn = document.getElementById("openSuggestionFormFromListBtn");
            if (openSuggestionFormFromListBtn) {
                openSuggestionFormFromListBtn.addEventListener("click", () => {
                    window.open("/suggestionmake.html", "_blank");
                });
            }

            async function renderSuggestions(filter = "") {
                if (!sugListBody || !localSupabase) return;
                try {
                    let query = localSupabase
                        .from("suggestions")
                        .select("*")
                        .order("created_at", { ascending: false });
                    if (filter) {
                        query = query.eq("status", filter);
                    }
                    const { data, error } = await query;
                    if (error) {
                        sugListBody.innerHTML = `<tr><td colspan="6"><div class="empty">Failed to load suggestions: ${error.message}</div></td></tr>`;
                        return;
                    }
                    const rows = Array.isArray(data) ? data : [];
                    if (sugCount) sugCount.textContent = `${rows.length} suggestion${rows.length === 1 ? '' : 's'}`;
                    if (rows.length === 0) {
                        sugListBody.innerHTML = `<tr><td colspan="6"><div class="empty">No suggestions found.</div></td></tr>`;
                        return;
                    }
                    sugListBody.innerHTML = rows.map((row) => {
                        const title = (row.title || "").replace(/</g, "&lt;").replace(/>/g, "&gt;");
                        const category = (row.category || "—").replace(/</g, "&lt;").replace(/>/g, "&gt;");
                        const from = ((row.author_name || row.email) || "Anonymous").replace(/</g, "&lt;").replace(/>/g, "&gt;");
                        const created = row.created_at ? new Date(row.created_at).toLocaleString() : "";
                        const status = row.status || "open";
                        const statusClass = status === "open" ? "codes-used-no" : "codes-used-yes";
                        return `<tr>
                            <td>
                                <strong>${title}</strong><br/>
                                <span style="font-size:12px;color:#64748b;">${(row.message || "").replace(/</g, "&lt;").replace(/>/g, "&gt;")}</span>
                            </td>
                            <td>${category}</td>
                            <td>${from}</td>
                            <td>${created}</td>
                            <td class="${statusClass}">${status}</td>
                            <td>
                                <button type="button" class="delete-code-btn" data-id="${row.id}" data-status="${status}" data-action="reviewed" style="background:#2563eb;">Mark Reviewed</button>
                                <button type="button" class="delete-code-btn" data-id="${row.id}" data-status="${status}" data-action="closed">Close</button>
                                <button type="button" class="delete-code-btn" data-id="${row.id}" data-status="${status}" data-action="open">Reopen</button>
                            </td>
                        </tr>`;
                    }).join("");

                    sugListBody.querySelectorAll(".delete-code-btn").forEach((btn) => {
                        btn.addEventListener("click", async () => {
                            const id = btn.getAttribute("data-id");
                            const action = btn.getAttribute("data-action");
                            const { error } = await localSupabase
                                .from("suggestions")
                                .update({ status: action, updated_at: new Date().toISOString() })
                                .eq("id", id);
                            if (error) {
                                alert("Failed to update suggestion: " + error.message);
                                return;
                            }
                            renderSuggestions(filterSelect.value);
                        });
                    });
                } catch (err) {
                    sugListBody.innerHTML = `<tr><td colspan="6"><div class="empty">An unexpected error occurred.</div></td></tr>`;
                    console.error(err);
                }
            }

            renderSuggestions();

            if (filterSelect) {
                filterSelect.addEventListener("change", () => {
                    renderSuggestions(filterSelect.value);
                });
            }
        }

                        .from("development_tasks")
                        .select("*")
                        .order("created_at", { ascending: true });
                    if (error) { kanbanBoard.innerHTML = `<div class="empty">Failed to load tasks: ${error.message}</div>`; return; }
                    allTasks = Array.isArray(data) ? data : [];

                    // Surface open suggestions as todo cards on the development board
                    try {
                        const { data: suggestions } = await localSupabase.from("suggestions").select("*").eq("status", "open");
                        if (Array.isArray(suggestions)) {
                            suggestions.forEach(s => {
                                allTasks.push({
                                    id: "sug-" + s.id,
                                    title: s.title,
                                    description: s.message || "",
                                    status: "todo",
                                    priority: "medium",
                                    assigned_to: "Unassigned",
                                    created_at: s.created_at,
                                    isSuggestion: true
                                });
                            });
                        }
                    } catch (e) { console.error(e); }
                    
                    kanbanBoard.innerHTML = statuses.map(s => {
                        const tasks = allTasks.filter(t => t.status === s.id);
                        return `
                            <div class="kanban-column" data-status="${s.id}">
                                <div class="kanban-header ${s.id}" style="border-top-color: ${s.color};">
                                    <span>${s.label}</span>
                                    <span class="kanban-count">${tasks.length}</span>
                                </div>
                                <div class="kanban-cards" id="cards-${s.id}" data-status="${s.id}">
                                    ${tasks.map(task => renderCard(task)).join("")}
                                    <button type="button" class="kanban-add-btn" data-status="${s.id}">+ Add Task</button>
                                </div>
                            </div>
                        `;
                    }).join("");

                    // Add card click handlers
                    kanbanBoard.querySelectorAll(".kanban-card").forEach(card => {
                        card.addEventListener("click", (e) => {
                            if (e.target.closest(".kanban-btn")) return;
                            const taskId = card.getAttribute("data-task-id");
                            const task = allTasks.find(t => t.id === taskId);
                            if (task && !task.isSuggestion) openModal(task);
                        });
                    });

                    // Add task button handlers
                    kanbanBoard.querySelectorAll(".kanban-add-btn").forEach(btn => {
                        btn.addEventListener("click", () => {
                            taskStatus.value = btn.getAttribute("data-status");
                            openModal();
                        });
                    });

                    // Delete button handlers
                    kanbanBoard.querySelectorAll(".kanban-btn.delete").forEach(btn => {
                        btn.addEventListener("click", async (e) => {
                            e.stopPropagation();
                            const taskId = btn.getAttribute("data-task-id");
                            if (!confirm("Delete this task?")) return;
                            const { error } = await localSupabase.from("development_tasks").delete().eq("id", taskId);
                            if (error) { alert("Failed to delete: " + error.message); return; }
                            renderBoard();
                        });
                    });

                    // Status change buttons
                    kanbanBoard.querySelectorAll(".kanban-btn.move").forEach(btn => {
                        btn.addEventListener("click", async (e) => {
                            e.stopPropagation();
                            const taskId = btn.getAttribute("data-task-id");
                            const newStatus = btn.getAttribute("data-new-status");
                            const { error } = await localSupabase
                                .from("development_tasks")
                                .update({ status: newStatus, updated_at: new Date().toISOString() })
                                .eq("id", taskId);
                            if (error) { alert("Failed to move: " + error.message); return; }
                            renderBoard();
                        });
                    });

                } catch (err) { kanbanBoard.innerHTML = `<div class="empty">An unexpected error occurred.</div>`; console.error(err); }
            }

            function renderCard(task) {
                const title = (task.title || "").replace(/</g, "<").replace(/>/g, ">");
                const description = (task.description || "").replace(/</g, "<").replace(/>/g, ">");
                const status = task.status || "todo";
                const priority = task.priority || "medium";
                const assignedTo = task.assigned_to || "Unassigned";
                const created = task.created_at ? new Date(task.created_at).toLocaleDateString() : "";
                const statusIdx = statuses.findIndex(s => s.id === status);
                const canMoveLeft = statusIdx > 0;
                const canMoveRight = statusIdx < statuses.length - 1;
                const nextStatus = canMoveRight ? statuses[statusIdx + 1].id : null;
                const prevStatus = canMoveLeft ? statuses[statusIdx - 1].id : null;

                return `
                    <div class="kanban-card ${status}" data-task-id="${task.id}" draggable="true">
                        <div class="kanban-card-title">${title}</div>
                        ${description ? `<div class="kanban-card-description">${description}</div>` : ""}
                        <div class="kanban-card-meta">
                            <span class="kanban-priority ${priority}">${priority}</span>
                            <span class="kanban-assignee">${assignedTo}</span>
                            <span class="kanban-date">${created}</span>
                        </div>
                        <div class="kanban-actions">
                            ${task.isSuggestion ? "" : (prevStatus ? `<button type="button" class="kanban-btn move" data-task-id="${task.id}" data-new-status="${prevStatus}">← Back</button>` : "")}
                            ${task.isSuggestion ? "" : (nextStatus ? `<button type="button" class="kanban-btn move" data-task-id="${task.id}" data-new-status="${nextStatus}">Next →</button>` : "")}
                            ${task.isSuggestion ? "" : `<button type="button" class="kanban-btn delete" data-task-id="${task.id}">Delete</button>`}
                        </div>
                    </div>
                `;
            }

            renderBoard();
        }

        async function loadBannedIds() {
            const staff = await ensureStaff();
            if (!staff.allowed) return;
            if (staff.department !== "Management") {
                showStatus("Access denied. Management only.", "error");
                return;
            }
            pageTitle.textContent = "Banned IDs";
            contentEl.innerHTML = `
                <div class="codes-section">
                    <h2>Banned Email Addresses</h2>
                    <p>Ban an email address to prevent them from logging into PulseCAD.</p>
                    <div class="premium-key-display">
                        <input type="email" class="premium-key-input" id="banEmailInput" placeholder="Enter email to ban..." />
                        <input type="text" class="premium-key-input" id="banReasonInput" placeholder="Reason for ban..." />
                        <button type="button" class="verified-btn" id="banEmailBtn" style="background:#dc2626;">Ban Email</button>
                    </div>
                    <label style="display:flex;align-items:center;gap:8px;margin-top:12px;font-size:14px;color:#1a202c;cursor:pointer;">
                        <input type="checkbox" id="banDeleteServersInput" style="width:16px;height:16px;cursor:pointer;" />
                        Also delete every server they own
                    </label>
                </div>
                <div class="codes-list-section">
                    <h3>Banned Emails</h3>
                    <div class="codes-count" id="bannedCount"></div>
                    <table class="codes-list-table">
                        <tr><th>Email</th><th>Reason</th><th>Banned By</th><th>Banned At</th><th>Actions</th></tr>
                        <tbody id="bannedListBody"><tr><td colspan="5"><div class="empty">Loading...</div></td></tr></tbody>
                    </table>
                </div>
            `;

            const banEmailInput = document.getElementById("banEmailInput");
            const banReasonInput = document.getElementById("banReasonInput");
            const banDeleteServersInput = document.getElementById("banDeleteServersInput");
            const banEmailBtn = document.getElementById("banEmailBtn");
            const bannedListBody = document.getElementById("bannedListBody");
            const bannedCount = document.getElementById("bannedCount");

            function escapeHtml(value) {
                return (value || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
            }

            async function renderBanned() {
                if (!bannedListBody || !localSupabase) return;
                try {
                    const { data, error } = await localSupabase
                        .from("banned_emails")
                        .select("id, email, reason, banned_by, banned_at")
                        .order("banned_at", { ascending: false });
                    if (error) {
                        bannedListBody.innerHTML = `<tr><td colspan="5"><div class="empty">Failed to load banned emails: ${escapeHtml(error.message)}</div></td></tr>`;
                        return;
                    }
                    const banned = Array.isArray(data) ? data : [];
                    if (bannedCount) bannedCount.textContent = `${banned.length} banned email${banned.length === 1 ? '' : 's'}`;
                    if (banned.length === 0) {
                        bannedListBody.innerHTML = `<tr><td colspan="5"><div class="empty">No banned emails.</div></td></tr>`;
                        return;
                    }
                    bannedListBody.innerHTML = banned.map((item) => {
                        const email = escapeHtml(item.email);
                        const reason = escapeHtml(item.reason) || `<span class="empty">—</span>`;
                        const bannedBy = escapeHtml(item.banned_by) || "—";
                        const bannedAt = item.banned_at ? new Date(item.banned_at).toLocaleString() : "";
                        return `<tr><td>${email}</td><td>${reason}</td><td>${bannedBy}</td><td>${bannedAt}</td><td><button type="button" class="delete-code-btn unban-btn" data-id="${item.id}">Unban</button></td></tr>`;
                    }).join("");

                    bannedListBody.querySelectorAll(".delete-code-btn").forEach((btn) => {
                        btn.addEventListener("click", async () => {
                            const id = btn.getAttribute("data-id");
                            const { error } = await localSupabase
                                .from("banned_emails")
                                .delete()
                                .eq("id", id);
                            if (error) {
                                alert("Failed to unban: " + error.message);
                                return;
                            }
                            renderBanned();
                        });
                    });
                } catch (err) {
                    bannedListBody.innerHTML = `<tr><td colspan="5"><div class="empty">An unexpected error occurred.</div></td></tr>`;
                    console.error(err);
                }
            }

            renderBanned();

            if (banEmailBtn && banEmailInput && localSupabase) {
                banEmailBtn.addEventListener("click", async () => {
                    const email = banEmailInput.value.trim();
                    const reason = banReasonInput ? banReasonInput.value.trim() : "";
                    if (!email) {
                        alert("Please enter an email to ban.");
                        return;
                    }
                    try {
                        const { data: { user } } = await localSupabase.auth.getUser();
                        const { data: existingRows, error: checkError } = await localSupabase
                            .from("banned_emails")
                            .select("id, email");
                        if (checkError) {
                            alert("Failed to check banned emails: " + checkError.message);
                            return;
                        }
                        const alreadyBanned = (existingRows || []).some(
                            (item) => (item.email || "").toLowerCase() === email.toLowerCase()
                        );
                        if (alreadyBanned) {
                            alert("This email is already banned.");
                            return;
                        }
                        const { error: insertError } = await localSupabase
                            .from("banned_emails")
                            .insert({
                                email: email,
                                reason: reason || null,
                                banned_by: user ? user.email : null,
                                banned_at: new Date().toISOString()
                            });
                        if (insertError) {
                            alert("Failed to ban email: " + insertError.message);
                            return;
                        }

                        const deleteServers = !!(banDeleteServersInput && banDeleteServersInput.checked);
                        if (deleteServers) {
                            const { data: allServers, error: serversError } = await localSupabase
                                .from("communities")
                                .select("id, name, creator_email");
                            if (serversError) {
                                alert("Email banned, but failed to look up owned servers: " + serversError.message);
                            } else {
                                const owned = (allServers || []).filter(
                                    (row) => (row.creator_email || "").toLowerCase() === email.toLowerCase()
                                );
                                if (owned.length === 0) {
                                    alert("Email banned. No servers were owned by this account.");
                                } else {
                                    const ids = owned.map((row) => row.id);
                                    const { error: membershipError } = await localSupabase
                                        .from("user_communities")
                                        .delete()
                                        .in("community_id", ids);
                                    if (membershipError) {
                                        console.error("Failed to remove community memberships:", membershipError);
                                    }
                                    const { error: deleteError } = await localSupabase
                                        .from("communities")
                                        .delete()
                                        .in("id", ids);
                                    if (deleteError) {
                                        alert("Email banned, but failed to delete their servers: " + deleteError.message);
                                    } else {
                                        alert(`Email banned. Deleted ${ids.length} server${ids.length === 1 ? '' : 's'} they owned.`);
                                    }
                                }
                            }
                        }

                        banEmailInput.value = "";
                        if (banReasonInput) banReasonInput.value = "";
                        if (banDeleteServersInput) banDeleteServersInput.checked = false;
                        renderBanned();
                    } catch (err) {
                        alert("An unexpected error occurred.");
                        console.error(err);
                    }
                });
            }
        }

        function showApplicationForm() {
            pageTitle.textContent = "Customer Support Application";
            contentEl.innerHTML = `
                <form class="app-form">
                    <label>What is your Discord username and ID?</label>
                    <input type="text" />

                    <label>How old are you?</label>
                    <input type="text" />

                    <label>What time zone are you in?</label>
                    <input type="text" />

                    <label>How active can you be each week?</label>
                    <input type="text" />

                    <label>Have you been a member of our community before? If so, for how long?</label>
                    <input type="text" />

                    <button type="button" class="verified-btn" id="backAppBtn">Back</button>
                </form>
            `;

            const backAppBtn = document.getElementById("backAppBtn");
            if (backAppBtn) {
                backAppBtn.addEventListener("click", loadApplications);
            }
        }

        async function fetchJson(url, ms) {
            const ctrl = new AbortController();
            const t = setTimeout(() => ctrl.abort(), ms || 6000);
            try {
                const res = await fetch(url, { cache: "no-store", signal: ctrl.signal });
                clearTimeout(t);
                if (!res.ok) return null;
                return await res.json();
            } catch (e) {
                clearTimeout(t);
                return null;
            }
        }

        async function getClientIp() {
            const providers = [
                () => fetchJson("https://api.ipify.org?format=json").then((j) => j && j.ip),
                () => fetchJson("https://ipwho.is/").then((j) => j && j.success && j.ip),
                () => fetchJson("https://api.my-ip.io/ip").then((t) => (typeof t === "string" && t.trim()) ? t.trim() : null)
            ];
            for (const p of providers) {
                try {
                    const ip = await p();
                    if (ip) return ip;
                } catch (e) { /* try next */ }
            }
            return null;
        }

        async function captureMyIp() {
            if (!localSupabase) return;
            try {
                const { data: { user } } = await localSupabase.auth.getUser();
                if (!user) return;
                const ip = await getClientIp();
                if (ip) {
                    await localSupabase.from("users").update({ ip: ip }).eq("id", user.id);
                }
            } catch (e) { /* ignore */ }
        }

        captureMyIp();

        function showAccessDenied() {
            document.body.innerHTML = `
                <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;font-family:inherit;">
                    <div style="font-size:24px;font-weight:700;color:#0f172a;">Access Denied</div>
                    <div style="font-size:14px;color:#64748b;max-width:420px;">You do not have access to the staff dashboard. If you believe this is a mistake, please contact a manager.</div>
                    <a href="index.html" style="display:inline-block;padding:10px 18px;border-radius:999px;background:#2563eb;color:#ffffff;font-size:14px;font-weight:700;text-decoration:none;">Return Home</a>
                </div>
            `;
        }

        async function init() {
            const staff = await ensureStaff();
            if (!staff.allowed) {
                showAccessDenied();
                return;
            }
            initSidebar();
            loadServers();
        }

        init();

        async function triggerRestart() {
            if (!confirm("Are you sure you want to restart all servers? This will temporarily make the site unavailable.")) {
                return;
            }
            location.reload();
        }
    </script>
